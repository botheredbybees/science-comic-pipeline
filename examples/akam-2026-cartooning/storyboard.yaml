# Draft storyboard. Every claim below was checked against the full text of the paper
# (Europe PMC PMC13022473, including Figures 3 to 7) on 2026-11-13; see CLAIM-CHECK.md for
# what the check found. The characters and scenes are invented for the comic.
version: 2

meta:
  title: "Draw It Yourself"
  audience: "Undergraduate biology students and the staff who teach them"
  left_out:
    - "The student cartoons shown in the paper, for example apoptosis as a plague outbreak and a cancer cell taking over a celebrity chef's kitchen. They are the students' own work; the comic could draw its own."
    - "The paper's three aims (go beyond recall in Bloom's taxonomy, build skills, make the experience memorable) and its dual-coding and cognitive-load explanations for why cartoons might work."
    - "The suggestion to run the activity as guided homework when seminar time is short, and the authors' note that the balance of power between teacher and students was not evaluated."
    - "The survey item on being encouraged to ask questions (rated 3.9) and the advice to offer other ways to ask them."
    - "The skills students named in their comments: collaboration, using technology, presenting, researching, creativity and confidence."
  source:
    title: "Cartooning in Biological Learning"
    authors: ["Soukaina Bahsoun", "Mhairi Morris", "Elizabeth Akam"]
    year: 2026
    doi: "10.1002/bmb.70040"
    url: "https://europepmc.org/articles/PMC13022473"
    licence: "CC BY 4.0"
    licence_checked: "The article's own licence statement (Europe PMC full-text XML), 2026-11-13"
  spine:
    and: "Cell biology is hard to learn, and concept cartoons are an established way to make it approachable."
    but: "Concept cartoons are normally handed to students, and it was not known what happens when the students draw them."
    therefore: "Teams in three modules turned DNA repair, apoptosis and the hallmarks of cancer into cartoons, then took a quiz and a survey. The results were good, with clear limits."

cast:
  - id: sam
    name: "Sam"
    role: "A second-year biology student"
    look: "Stick figure with a messy ponytail and a lanyard"
  - id: dr_okoye
    name: "Dr Okoye"
    role: "A lecturer who has run out of slides"
    look: "Stick figure with round glasses and a mug"

claims:
  - id: C1
    text: "Learning cell biology is hard: the terminology is complex, the concepts are abstract, the processes have many steps, and there is a great deal of information."
    kind: background
    source:
      locator: "Introduction, paragraph 1"
      quote: "complex, acronymized and often historical terminology, abstract concepts, multi-step processes, integration of knowledge, and volume of information"
    status: verified
  - id: C2
    text: "Concept cartoons were introduced by Keogh and Naylor in the late 1990s and have been used to engage learners and start discussions; they are reported to help with misconceptions."
    kind: background
    source: { locator: "Introduction, paragraph 2" }
    status: verified
  - id: C3
    text: "Three modules at Loughborough University, at UK levels 4 to 6, took part. Their topics were DNA repair mechanisms, signalling of life and death, and the molecular hallmarks of cancer."
    kind: method
    source: { locator: "Methods, paragraph 1 and Table 1" }
    status: verified
  - id: C4
    text: "79 students took part. They formed teams of two to six, and each team randomly chose a subtopic and made a cartoon of it."
    kind: method
    source: { locator: "Methods, paragraphs 1 and 3" }
    status: verified
  - id: C5
    text: "Only three of the five subtopics were on offer, so that cartooned and not-cartooned subtopics could be compared."
    kind: method
    source: { locator: "Methods, paragraph 3" }
    status: verified
  - id: C6
    text: "The session was run as a friendly competition with chocolate prizes. Each group ranked the other groups' cartoons and the points decided the winner."
    kind: method
    source: { locator: "Methods, paragraphs 3 and 4" }
    status: verified
  - id: C7
    text: "Learning was tested with a 10-question multiple-choice quiz: six questions on cartooned subtopics and four on not-cartooned ones. It was given in two of the three modules."
    kind: method
    source: { locator: "Methods, final paragraph" }
    status: verified
  - id: C8
    text: "A separate anonymous survey had 18 questions, a mix of 5-point scales and free-form comments."
    kind: method
    source: { locator: "Methods, paragraph 5" }
    status: verified
  - id: C9
    text: "A Mann-Whitney U test found a significant difference in quiz performance between cartooned and not-cartooned subtopics (U = 12.0, p = 0.004)."
    kind: result
    source: { locator: "Results, Assessment of Learning" }
    status: verified
  - id: C10
    text: "Cartooned subtopics scored higher: a median of 81.74 percent correct (IQR 19.32), against 50.55 percent (IQR 31.69) for not-cartooned subtopics."
    kind: result
    source: { locator: "Results, Assessment of Learning; Figure 7" }
    status: verified
    note: "The Results sentence lists 50.55 first and 81.74 second 'respectively' after 'cartooned and non-cartooned', which reads as the reverse. Figure 7 and a median recomputed from its bars (about 81.5 cartooned, about 50 not cartooned) show cartooned higher, so the text's order looks like a slip. Not confirmed with the authors."
  - id: C11
    text: "The quiz comparison uses 20 question-level averages (2 quizzes by 10 questions), not individual students' scores."
    kind: caveat
    source: { locator: "Methods, final paragraph" }
    status: verified
  - id: C12
    text: "Average survey ratings out of 5: well organised with clear instructions 4.8, engaging 4.5, improved my understanding 4.2. Learning about other groups' topics from their presentations rated 3.3."
    kind: result
    source: { locator: "Results; Figures 3, 4 and 5" }
    status: verified
    note: "The abstract labels 4.8 as 'engagement'. In Figure 3 it is the organisation and clarity item; engagement (Figure 4) is 4.5."
  - id: C13
    text: "68 percent of students preferred the cartooning activity to learning in a traditional question and answer format."
    kind: result
    source: { locator: "Results, Reflection and Future Use; Figure 6" }
    status: verified
  - id: C14
    text: "Reactions to using cartooning for revision were mixed: 44 percent scored 4 or 5 and 20 percent scored 1 or 2."
    kind: caveat
    source: { locator: "Results, Reflection and Future Use" }
    status: verified
  - id: C15
    text: "In 120 free-form comments the themes were improved learning experience (36 percent of responses), engagement (32 percent), collaborative learning (30 percent) and skill development (12 percent)."
    kind: result
    source: { locator: "Results, Open-Ended Feedback" }
    status: verified
    note: "The percentages overlap, so they sum to more than 100."

beats:
  - id: B1
    title: "The problem"
    act: problem
    panels:
      - id: B1.1
        weight: standard
        word_picture: additive
        scene: "A lecture hall. Sam stares at a slide of a cell-signalling pathway that is mostly arrows."
        speech:
          - { speaker: sam, kind: think, text: "Complex terms, abstract ideas, steps on steps on steps." }
        claim_ids: [C1]
        humour:
          note: "Deadpan: the slide's title is 'Simplified'."
          keeps_claims_intact: true
      - id: B1.2
        weight: standard
        transition: subject-to-subject
        word_picture: duo-specific
        frame: borderless
        scene: "Dr Okoye holds up a cartoon of two people waiting at a bus stop, one holding a sign that reads 'receptor'."
        speech:
          - { speaker: dr_okoye, text: "Concept cartoons date from the late 1990s. They start discussions." }
        claim_ids: [C2]
      - id: B1.3
        weight: wide
        transition: action-to-action
        word_picture: additive
        scene: "Dr Okoye hands Sam a marker instead of a slide clicker. Sam looks at it as though it were a live animal."
        speech:
          - { speaker: narrator, kind: caption, text: "Usually the teacher draws them. What if the students did?" }

  - id: B2
    title: "The study"
    act: method
    panels:
      - id: B2.1
        weight: wide
        transition: scene-to-scene
        word_picture: parallel
        scene: "A whiteboard with five subtopic cards pinned up, two covered with sheets of paper. Teams of different sizes crowd around the other three."
        speech:
          - { speaker: narrator, kind: caption, text: "Three modules. 79 students. Teams of 2 to 6. Five subtopics, only three on offer." }
        claim_ids: [C3, C4, C5]
      - id: B2.2
        weight: standard
        transition: subject-to-subject
        word_picture: duo-specific
        frame: borderless
        scene: "Teams pin finished cartoons to a wall and score each other's with a pencil. A bowl of chocolate sits in the foreground, guarded."
        speech:
          - { speaker: narrator, kind: caption, text: "A friendly competition. Teams ranked each other's work. The prize was chocolate." }
        claim_ids: [C6]
        humour:
          note: "Scale: a very small bowl, guarded as if it were the Crown Jewels."
          keeps_claims_intact: true
      - id: B2.3
        weight: standard
        transition: scene-to-scene
        word_picture: word-specific
        scene: "Sam, at a desk, between a quiz paper and a phone showing a survey form."
        speech:
          - { speaker: narrator, kind: caption, text: "Then a 10-question quiz: 6 questions on cartooned subtopics, 4 on the rest. And an anonymous 18-question survey." }
        claim_ids: [C7, C8]

  - id: B3
    title: "What they found"
    act: result
    panels:
      - id: B3.1
        weight: wide
        transition: scene-to-scene
        word_picture: interdependent
        scene: "A hand-drawn chart with two bars: a tall one labelled 'cartooned' and a shorter one labelled 'not cartooned'."
        speech:
          - { speaker: narrator, kind: caption, text: "Quiz median: cartooned 82 percent correct, not cartooned 51. Significant: p = 0.004." }
        claim_ids: [C9, C10]
      - id: B3.2
        weight: small
        transition: subject-to-subject
        word_picture: picture-specific
        frame: borderless
        scene: "Dr Okoye, in close-up, looks at the chart. Says nothing. Sips from the mug."
        humour:
          note: "A silent beat before the deflation: the small, empty panel is the pause."
          keeps_claims_intact: true
      - id: B3.3
        weight: standard
        transition: moment-to-moment
        word_picture: interdependent
        frame: borderless
        scene: "Dr Okoye lowers the mug and points to a tiny footnote under the chart."
        speech:
          - { speaker: dr_okoye, text: "Significant, yes. But that's 20 question averages, not 79 students." }
        claim_ids: [C11, C4]
        humour:
          note: "Understatement: the lecturer, with a mug, calmly deflating their own chart."
          keeps_claims_intact: true
      - id: B3.4
        weight: wide
        transition: scene-to-scene
        word_picture: parallel
        scene: "Hand-drawn bars: 'organised' tallest, then 'engaging', 'understanding', and a much shorter bar for 'learned from other groups'."
        speech:
          - { speaker: narrator, kind: caption, text: "Ratings out of 5: organised 4.8, engaging 4.5, understanding 4.2. Learning from other groups' cartoons: 3.3. 68 percent preferred it to question and answer." }
        claim_ids: [C12, C13]

  - id: B4
    title: "What it means"
    act: discussion
    panels:
      - id: B4.1
        weight: full
        transition: scene-to-scene
        word_picture: duo-specific
        scene: "Sam, marker in hand, hesitates over a blank page headed 'REVISION'. A teammate is already drawing next to them."
        speech:
          - { speaker: narrator, kind: caption, text: "Would they use it to revise? 44 percent said yes and 20 percent said no. In 120 comments, the themes were learning, engagement, working together, and skills." }
          - { speaker: sam, text: "Mixed. But I did meet everyone in my group." }
        claim_ids: [C14, C15]
