# Draft storyboard. Every claim below comes from the paper's ABSTRACT only; none has
# been checked against the full text, so all are 'abstract_only' (see the warnings the
# validator prints). The characters and scenes are invented for the comic.
version: 1

meta:
  title: "Draw It Yourself"
  audience: "Undergraduate biology students and the staff who teach them"
  source:
    title: "Cartooning in Biological Learning"
    authors: ["Soukaina Bahsoun", "Mhairi Morris", "Elizabeth Akam"]
    year: 2026
    doi: "10.1002/bmb.70040"
    url: "https://europepmc.org/articles/PMC13022473"
    licence: "CC BY 4.0"
    licence_checked: "Europe PMC record for PMC13022473, 2026-11-13; confirm on the article page before publishing"
  spine:
    and: "Bioscience students have to understand complicated, abstract ideas, and cartoons of everyday situations are a known way to make them approachable."
    but: "It is not obvious that students learn more when they draw the cartoons themselves."
    therefore: "Teams in three biology modules turned genetics, cell signalling and cancer processes into cartoons, then sat a quiz and a survey to find out."

cast:
  - id: sam
    name: "Sam"
    role: "A second-year biology student"
    look: "Stick figure with a messy ponytail and a lanyard"
  - id: dr_okoye
    name: "Dr Okoye"
    role: "A lecturer who has run out of slides"
    look: "Stick figure with round glasses and a mug"

claims:
  - id: C1
    text: "Teaching bioscience subjects requires helping students understand complicated and abstract concepts."
    kind: background
    source: { locator: "abstract" }
    status: abstract_only
  - id: C2
    text: "Concept cartoons are cartoon-style drawings that illustrate everyday situations."
    kind: background
    source: { locator: "abstract" }
    status: abstract_only
  - id: C3
    text: "The activity ran across three undergraduate biology modules, at levels four to six, on genetics, cell signalling and cancer."
    kind: method
    source: { locator: "abstract" }
    status: abstract_only
  - id: C4
    text: "79 students took part, working in teams of 2 to 6, each turning a biological process into a cartoon."
    kind: method
    source: { locator: "abstract" }
    status: abstract_only
  - id: C5
    text: "The activity was evaluated with a 10-question multiple-choice quiz and an 18-question survey on a 5-point scale, with free-form comments."
    kind: method
    source: { locator: "abstract" }
    status: abstract_only
  - id: C6
    text: "There was a statistically significant difference in performance between cartooned and not-cartooned subtopics."
    kind: result
    source: { locator: "abstract" }
    status: abstract_only
    note: "The abstract does not give the direction of the difference or the test used. Do not draw either until the full text is checked."
  - id: C7
    text: "Average student ratings were 4.8 for engagement, 4.5 for learning and 4.2 for understanding."
    kind: result
    source: { locator: "abstract" }
    status: abstract_only
    note: "Assumes these are out of 5, from the 5-point scale; confirm in the full text."
  - id: C8
    text: "68 percent of students preferred the cartooning activity to learning through traditional question and answer."
    kind: result
    source: { locator: "abstract" }
    status: abstract_only
  - id: C9
    text: "In free-form comments students cited improved understanding, and the activity fostered teamwork between cohorts."
    kind: result
    source: { locator: "abstract" }
    status: abstract_only

pages:
  - id: P1
    title: "The problem"
    panels:
      - id: P1.1
        act: problem
        scene: "A lecture hall. Sam stares at a slide of a cell-signalling pathway that is mostly arrows."
        speech:
          - { speaker: sam, kind: think, text: "Genetics. Cell signalling. Cancer. All of it is invisible, and all of it is on the exam." }
        claim_ids: [C1]
        humour:
          note: "Deadpan: the slide's title is 'Simplified'."
          keeps_claims_intact: true
      - id: P1.2
        act: problem
        frame: borderless
        scene: "Dr Okoye holds up a cartoon of two people waiting at a bus stop, one holding a sign that reads 'receptor'."
        speech:
          - { speaker: dr_okoye, text: "A concept cartoon is a drawing of an everyday situation that carries an idea." }
        claim_ids: [C2]
      - id: P1.3
        act: problem
        scene: "Dr Okoye hands Sam a marker instead of a slide clicker. Sam looks at it as though it were a live animal."
        speech:
          - { speaker: narrator, kind: caption, text: "But what if the students drew them?" }

  - id: P2
    title: "The study"
    panels:
      - id: P2.1
        act: method
        scene: "A whiteboard with three columns: GENETICS, CELL SIGNALLING, CANCER. Teams of different sizes crowd around each."
        speech:
          - { speaker: narrator, kind: caption, text: "Three biology modules. 79 students. Teams of 2 to 6. One process each, turned into a cartoon." }
        claim_ids: [C3, C4]
      - id: P2.2
        act: method
        frame: borderless
        scene: "Sam, at a desk, with a quiz paper on one side and a survey sheet on the other, and a speech bubble that has become a single line to Dr Okoye."
        speech:
          - { speaker: narrator, kind: caption, text: "Afterwards: a 10-question quiz, an 18-question survey, and room for comments." }
        claim_ids: [C5]

  - id: P3
    title: "What they found"
    panels:
      - id: P3.1
        act: result
        scene: "Two stacks of quiz papers, labelled 'cartooned' and 'not cartooned', with a question mark between them."
        speech:
          - { speaker: narrator, kind: caption, text: "Cartooned subtopics and not-cartooned subtopics did not score the same. The difference was statistically significant." }
        claim_ids: [C6]
      - id: P3.2
        act: result
        scene: "A bar chart drawn by hand: three bars labelled engagement, learning and understanding, each slightly shorter than the last."
        speech:
          - { speaker: narrator, kind: caption, text: "Ratings out of 5: engagement 4.8, learning 4.5, understanding 4.2. And 68 percent preferred this to question-and-answer." }
        claim_ids: [C7, C8]
      - id: P3.3
        act: discussion
        scene: "Sam and a teammate, back to back, each holding half of a cartoon that only works when joined."
        speech:
          - { speaker: sam, text: "I understood it better, and I got a team out of it." }
        claim_ids: [C9]
