claims:
  - id: C1
    text: "Net community production (NCP) is gross primary production minus community respiration."
    kind: background
    source: { locator: "Introduction, paragraph 1", page: 2, quote: "NCP is equal to gross primary production minus community respiration" }
    status: verified
  - id: C2
    text: "Plankton communities regulate NCP through the fate of organic matter production, which can be either recycled or exported to depth depending on phytoplankton size and density."
    kind: background
    source: { locator: "Introduction, paragraph 1", page: 2, quote: "Plankton communities regulate NCP through their influence on the fate of organic matter production, which can be either recycled or exported to depth depending on phytoplankton size and" }
    status: verified
  - id: C3
    text: "Export is generally predicted and modelled as a function of plankton functional types (PFTs)."
    kind: background
    source: { locator: "Introduction, paragraph 1", page: 2, quote: "predicted and modeled to be a function of Plankton Functional Types" }
    status: verified
  - id: C4
    text: "Conventional PFTs include picoautotrophs, diazotrophs, calcifiers and silicifiers such as diatoms."
    kind: background
    source: { locator: "Introduction, paragraph 1", page: 2, quote: "Conventional PFTs include picoautotrophs, diazotrophs (N2-fixers), calcifiers (e.g., coccolithophorids), and silicifiers (e.g., diatoms)" }
    status: verified
  - id: C5
    text: "Most diatoms are believed to be efficient carbon exporters because of their large size and heavy silica shells."
    kind: background
    source: { locator: "Introduction, paragraph 1", page: 2, quote: "most diatoms are believed to be efficient carbon exporters to depth because of their large size and heavy silica shells" }
    status: verified
  - id: C6
    text: "There is little understanding of how plankton biodiversity influences the carbon pump beyond broad paradigms such as diatoms contributing disproportionally to export."
    kind: background
    source: { locator: "Abstract", page: 1, quote: "we have little understanding of how this biodiversity influences the biological carbon pump other than broad paradigms such as diatoms contributing disproportionally to carbon export" }
    status: verified
  - id: C7
    text: "The Western Antarctic Peninsula (WAP) may be the 'canary in a coal mine' of the Southern Ocean."
    kind: background
    source: { locator: "Introduction, paragraph 2", page: 3, quote: "the WAP may represent the “canary in a coal mine” of the Southern Ocean" }
    status: verified
  - id: C8
    text: "Production at the base of the food chain, and upper trophic levels such as krill, fish, penguins, seals and whales, are likely to be affected by the rapid warming and sea ice loss."
    kind: background
    source: { locator: "Introduction, paragraph 2", page: 3, quote: "Community production at the bottom of the food chain, and local and remote upper trophic levels (e.g., krill, fish, penguins and other seabirds, seals, and whales) are likely to be affected by this rapid warming and associated sea ice" }
    status: verified
  - id: C9
    text: "The study combines high-resolution underway O2/Ar, which estimates net community production, with high-throughput 18S ribosomal DNA sequencing."
    kind: method
    source: { locator: "Abstract", page: 1, quote: "Here we combine high-resolution underway O2/Ar, which provides an estimate of net community production, with high-throughput 18 S ribosomal DNA sequencing" }
    status: verified
  - id: C10
    text: "Biological O2 supersaturation can be estimated from O2/Ar because oxygen and argon have similar solubility."
    kind: method
    source: { locator: "Materials and Methods, paragraph 1", page: 13, quote: "The biological O2 supersaturation can be estimated from O2/Ar because O2 and Ar have similar solubility properties" }
    status: verified
  - id: C11
    text: "The O2 residence time in the mixed layer was 8 to 19 days, averaging 11 days."
    kind: method
    source: { locator: "Materials and Methods, paragraph 1", page: 13, quote: "the O2 residence time in the mixed layer of 8 to 19 days (average of 11 days)" }
    status: verified
  - id: C12
    text: "That residence time falls within the 1 week to 1 month range of phytoplankton community succession."
    kind: method
    source: { locator: "Materials and Methods, paragraph 1", page: 13, quote: "is within the 1 week-1 month range of phytoplankton community succession time span" }
    status: verified
  - id: C13
    text: "Samples were collected on the annual Palmer LTER cruise from January to early February 2014 aboard the R/V Laurence M. Gould."
    kind: method
    source: { locator: "Sampling", page: 14, quote: "During the annual Palmer LTER cruise from Jan to early Feb in 2014 aboard the R/V Laurence M. Gould" }
    status: verified
  - id: C14
    text: "Surface seawater from the vessel's seawater supply line was gently vacuum filtered through 0.2 µm filters for DNA."
    kind: method
    source: { locator: "Sampling", page: 14, quote: "Surface seawater from the vessel seawater supply line was gently vacuum filtered through a 0.2 µm pore size Millipore Supor filters" }
    status: verified
  - id: C15
    text: "Temperature, salinity, oxygen, fluorescence and NCP were measured underway from the ship's clean flow-through seawater line."
    kind: method
    source: { locator: "Sampling", page: 14, quote: "Surface seawater temperature, salinity, oxygen, fluorescence, transmissometer beam Cp and NCP were measured underway from the ship’s clean flow-through seawater line system" }
    status: verified
  - id: C16
    text: "DNA was extracted from 21 stations, and the V4 region of the 18S gene was amplified and sequenced."
    kind: method
    source: { locator: "Materials and Methods, paragraph 1", page: 13, quote: "We extracted total DNA from 21 stations; PCR amplified and sequenced the hypervariable V4 region of the 18 S marker gene" }
    status: verified
  - id: C17
    text: "To account for biomass, NCP was normalised to particulate organic carbon (POC) in the mixed layer."
    kind: method
    source: { locator: "Results, paragraph 2", page: 4, quote: "In order to account for the influence of biomass on NCP, we normalized NCP to Particulate Organic Carbon (POC) concentration in the mixed layer" }
    status: verified
  - id: C18
    text: "POC-normalised NCP may, under some conditions, indicate the apparent sinking rate and turnover time of the organic carbon inventory in the mixed layer."
    kind: background
    source: { locator: "Results, paragraph 2", page: 4, quote: "the POC-normalized NCP may, under some conditions, provide insight into the apparent sinking rate and turn over time of the organic carbon inventory in the mixed layer" }
    status: verified
  - id: C19
    text: "At 464 operational taxonomic units (OTUs), defined at a 97% DNA similarity threshold, the community was characterised at roughly species-to-genus level."
    kind: method
    source: { locator: "Results, paragraph 3", page: 5, quote: "at the OTU level (i.e., species to genus) based on a 97% DNA similarity threshold (Fig. 2). In total, 464 OTUs were defined in the surveyed region" }
    status: verified
  - id: C20
    text: "Diatoms were the dominant group, accounting for an average of 41% of the total reads."
    kind: result
    source: { locator: "Results, paragraph 2", page: 4, quote: "diatoms were the dominant components of the plankton population during our survey, accounting for an average of 41% of the total reads" }
    status: verified
  - id: C21
    text: "The relative abundance of diatoms correlated positively with NCP (r2 = 0.35, p = 0.005) but not significantly with NCP/POC."
    kind: result
    source: { locator: "Results, paragraph 2", page: 4, quote: "the relative abundance of diatoms was positively correlated with NCP (r2 = 0.35, p = 0.005) but that there was no significant correlation with NCP/POC" }
    status: verified
  - id: C22
    text: "Centric diatoms correlated positively with NCP (r2 = 0.47, p = 0.0006)."
    kind: result
    source: { locator: "Results, paragraph 2", page: 4, quote: "A positive correlation was observed between the relative abundance of centric diatoms and NCP (r2 = 0.47, p = 0.0006)" }
    status: verified
  - id: C23
    text: "Surprisingly, pennate diatoms were not significantly correlated with NCP or NCP/POC."
    kind: result
    source: { locator: "Results, paragraph 2", page: 4, quote: "Surprisingly, the relative abundance of pennate diatoms was not significantly correlated with NCP or NCP/POC" }
    status: verified
  - id: C24
    text: "The top 20 OTUs, 4.3% of the diversity, made up 78% of all sequence reads."
    kind: result
    source: { locator: "Results, paragraph 3", page: 5, quote: "The top 20 OTUs, a small portion (4.3%) of the total diversity, accounted for 78% of the overall sequence read abundance" }
    status: verified
  - id: C25
    text: "Three OTUs accounted for 92% of the variance in NCP."
    kind: result
    source: { locator: "Results, paragraph 3", page: 5, quote: "three OTUs accounted for 92% of the NCP variance" }
    status: verified
  - id: C26
    text: "Only two OTUs explained 76% of the variance in NCP/POC."
    kind: result
    source: { locator: "Results, paragraph 3", page: 5, quote: "only two OTUs explained 76% of the NCP/POC variance" }
    status: verified
  - id: C27
    text: "Bulk diatoms explained only 35% of the variance in NCP and 16% of the variance in NCP/POC."
    kind: result
    source: { locator: "Results, paragraph 3", page: 5, quote: "bulk diatoms explained 35% and 16% of the NCP and NCP/POC variances, respectively" }
    status: verified
  - id: C28
    text: "The most dominant OTU, a pennate diatom of the genus Fragilariopsis, was not a good predictor of NCP (r2 = 0.12, p > 0.1)."
    kind: result
    source: { locator: "Results, paragraph 3", page: 5, quote: "a pennate diatom belonging to the genus Fragilariopsis, was not a good predictor of the geographic variability of NCP (r2 = 0.12, p > 0.1)" }
    status: verified
  - id: C29
    text: "Many Fragilariopsis species are ice algae, so their abundance in some areas may be due to sea ice melt seeding rather than new cell growth."
    kind: interpretation
    source: { locator: "Results, paragraph 3", page: 5, quote: "Many Fragilariopsis species are ice algae and the high abundance in some areas may be due to sea ice melt seeding rather than new cell growth" }
    status: verified
  - id: C30
    text: "PFTs may not predict NCP well in some regions, and variability within a PFT may exceed variability between PFTs."
    kind: interpretation
    source: { locator: "Results, paragraph 3", page: 5, quote: "Our results suggest that PFTs may not be good predictors of NCP in some regions and that the intra-PFT variability may be greater than inter-PFT in terms of NCP" }
    status: verified
  - id: C31
    text: "Two diatoms with distinct biogeography, Stellarima in a northern bloom near Palmer Station and Proboscia in the southern ice-edge bloom, were each positively correlated with NCP but not NCP/POC."
    kind: result
    source: { locator: "Results, paragraph 4", page: 6, quote: "Stellarima (OTU_8) in a north bloom near Palmer Station and Proboscia (OTU_6) dominating the south ice edge bloom" }
    status: verified
  - id: C32
    text: "This suggests these OTUs are associated with high production but relatively less efficient export systems."
    kind: interpretation
    source: { locator: "Results, paragraph 4", page: 6, quote: "were both positively correlated with NCP but not NCP/POC. This suggests that these OTUs are associated with high production but relatively less efficient export systems" }
    status: verified
  - id: C33
    text: "The haptophyte Phaeocystis was not correlated with NCP but was positively correlated with NCP/POC."
    kind: result
    source: { locator: "Results, paragraph 4", page: 6, quote: "the haptophyte Phaeocystis (OTU_3) was not correlated with NCP, but positively correlated with NCP/POC" }
    status: verified
  - id: C34
    text: "Phaeocystis averaged only 9.0% of reads, but at the station with the highest NCP/POC it co-dominated at 34.4% alongside diatoms at 36.1%."
    kind: result
    source: { locator: "Results, paragraph 4", page: 6, quote: "Phaeocystis accounted for only 9.0% of the total 18 S reads on average, but co-dominated (34.4%) with diatoms (36.1%) at station (600.040) that had the highest NCP/POC" }
    status: verified
  - id: C35
    text: "Phaeocystis forms massive aggregates at the colony stage that sink rapidly, and is considered a more efficient exporter of carbon than diatoms."
    kind: background
    source: { locator: "Results, paragraph 4", page: 6, quote: "form massive aggregates at the colony stage and sink rapidly out of the ocean surface and thus has been considered to be a more efficient exporter of carbon compared to" }
    status: verified
  - id: C36
    text: "Two mixotrophic or phagotrophic dinoflagellate OTUs were key negative contributors to the spatial variability of NCP and of NCP/POC."
    kind: result
    source: { locator: "Results, paragraph 5", page: 7, quote: "Two mixotrophic/phagotrophic dinoflagellate OTUs were identified as key negative contributors to the geographical variability of NCP (OTU_238) and NCP/POC (OTU_318)" }
    status: verified
  - id: C37
    text: "In contrast to large grazers packing matter into fast-sinking faecal pellets, unicellular microzooplankton are more likely to reduce carbon export."
    kind: background
    source: { locator: "Results, paragraph 5", page: 7, quote: "In contrast to large grazers enhancing NCP by packing organic matter into rapidly-sinking fecal pellets, unicellular protistan microzooplankton are more likely to reduce carbon export" }
    status: verified
  - id: C38
    text: "One of the dinoflagellate OTUs belongs to a kleptoplastic group known to prey on Phaeocystis and keep its chloroplasts."
    kind: result
    source: { locator: "Results, paragraph 5", page: 7, quote: "known to prey on Phaeocystis and retain their chloroplasts for" }
    status: verified
  - id: C39
    text: "The other dinoflagellate, of the genus Gyrodinium, has been observed to ingest diatoms much larger than itself and may curtail diatom blooms."
    kind: result
    source: { locator: "Results, paragraph 5", page: 7, quote: "Gyrodinium have been observed to ingest diatoms much larger than their own body size and may curtail diatom" }
    status: verified
  - id: C40
    text: "NCP and NCP/POC were also negatively correlated with Rhizaria (r2 = 0.29, p = 0.01 and r2 = 0.20, p = 0.04)."
    kind: result
    source: { locator: "Results, paragraph 6", page: 8, quote: "NCP and NCP/POC were also negatively correlated with Rhizaria (r2 = 0.29, p = 0.01; r2 = 0.20, p = 0.04, respectively)" }
    status: verified
  - id: C41
    text: "Rhizaria are not detected by traditional HPLC pigment analyses because they lack pigments."
    kind: background
    source: { locator: "Results, paragraph 6", page: 8, quote: "are not detected by traditional HPLC analyses due to their lack of pigments" }
    status: verified
  - id: C42
    text: "F. cylindrus does not correlate with NCP, yet in culture its maximum growth rate is significantly higher than that of Proboscia alata and Actinocyclus actinochilus (P < 0.05)."
    kind: result
    source: { locator: "Results, paragraph 7", page: 9, quote: "The distribution of F. cylindrus does not correlate to NCP or NCP/POC, yet its maximum growth rate in culture is significantly higher (P < 0.05) than Proboscia alata and Actinocyclus actinochilus" }
    status: verified
  - id: C43
    text: "Cell biovolume of P. alata and A. actinochilus is more than two orders of magnitude larger than that of F. cylindrus."
    kind: result
    source: { locator: "Results, paragraph 7", page: 9, quote: "The biovolume per cell for P. alata and A. actinochilus are more than two orders of magnitude larger than that of F. cylindrus" }
    status: verified
  - id: C44
    text: "Growth rates of the three diatoms under the tested conditions varied by less than 2-fold."
    kind: result
    source: { locator: "Results, paragraph 7", page: 9, quote: "the cellular growth rates under the examined conditions were comparable between the three diatoms (i.e., varied by less than 2-fold)" }
    status: verified
  - id: C45
    text: "Large size could directly raise sinking rates and export, or uncouple cells from their slow-growing grazers."
    kind: interpretation
    source: { locator: "Results, paragraph 7", page: 9, quote: "Large size could directly enhance the sinking rates of phytoplankton cells and lead to higher export, or uncouple them from their slow-growing grazers" }
    status: verified
  - id: C46
    text: "Boom-and-bust species with high growth rates can outpace grazer growth when conditions turn favourable, and contribute to more efficient export."
    kind: interpretation
    source: { locator: "Results, paragraph 7", page: 9, quote: "once the environment becomes favorable, boom-and-bust species with high growth rates can quickly outpace grazer growth and contribute to more efficient export" }
    status: verified
  - id: C47
    text: "Persistent species are better at stress tolerance."
    kind: background
    source: { locator: "Results, paragraph 7", page: 9, quote: "Species with a persistent life strategy are better at stress tolerance" }
    status: verified
  - id: C48
    text: "Low NCP/POC communities had almost double the number of network edges of high NCP/POC communities, 496 against 262."
    kind: result
    source: { locator: "Results, paragraph 8", page: 10, quote: "the low NCP/POC communities, compared to the high NCP/POC communities, are characterized by almost double the number of edges (496 vs. 262)" }
    status: verified
  - id: C49
    text: "These features suggest that low NCP/POC communities are more tightly coupled than high NCP/POC communities."
    kind: interpretation
    source: { locator: "Results, paragraph 8", page: 10, quote: "All these features suggest that the low NCP/POC communities are more tightly coupled than the high NCP/POC communities" }
    status: verified
  - id: C50
    text: "Each network was built from only 11 stations."
    kind: caveat
    source: { locator: "Results, paragraph 8", page: 10, quote: "Although the sample size is relatively small (i.e., 11 stations for each group)" }
    status: verified
  - id: C51
    text: "This may support the paradigm that more tightly coupled ecosystems are less efficient exporters of carbon."
    kind: interpretation
    source: { locator: "Results, paragraph 8", page: 10, quote: "This may support the general paradigm that more tightly coupled ecosystems (e.g., coupling between microzookplankton grazers and phytoplankton), are less efficient exporters of carbon" }
    status: verified
  - id: C52
    text: "NCP(O2/Ar) in this region correlates highly (r2 = 0.83) with NCP calculated from seasonal DIC drawdown."
    kind: method
    source: { locator: "Materials and Methods, paragraph 3", page: 16, quote: "is highly correlated (r2 = 0.83) with the NCP calculated from the seasonal DIC" }
    status: verified
  - id: C53
    text: "The estimated change in POC inventory over the preceding days averaged 18% of the NCP measurements."
    kind: method
    source: { locator: "Materials and Methods, steady state", page: 17, quote: "The estimated time-derivative of the POC inventory over the days prior to ship sampling was on average 18% of the NCP measurements" }
    status: verified
  - id: C54
    text: "That steady-state check had only 4 comparisons because of cloud cover and should be interpreted with caution."
    kind: caveat
    source: { locator: "Materials and Methods, steady state", page: 17, quote: "This analysis resulted in only 4 comparisons because of cloud cover and should therefore be interpreted with caution" }
    status: verified
  - id: C55
    text: "A lack of steady state in the mixed-layer carbon budget may blur some of the relationships."
    kind: caveat
    source: { locator: "Results, caveats", page: 11, quote: "A lack of steady-state in the mixed-layer carbon budget may blur some of the relationships" }
    status: verified
  - id: C56
    text: "16S and 18S reads differ from taxon-specific cell counts, partly because rDNA copy numbers vary per cell."
    kind: caveat
    source: { locator: "Results, caveats", page: 11, quote: "the 16 S and 18 S reads are different from taxa-specific cell counts especially considering the variability of rDNA copy numbers per cell" }
    status: verified
  - id: C57
    text: "The network and correlation analyses do not necessarily reflect direct causal ecological relationships."
    kind: caveat
    source: { locator: "Results, caveats", page: 11, quote: "Our network and correlation analyses should also be interpreted with caution because 1) they do not necessarily reflect direct causal ecological relationships" }
    status: verified
  - id: C58
    text: "It will be important to validate these results with estimates of in situ growth rates, photophysiology, microzooplankton growth and grazing rates."
    kind: interpretation
    source: { locator: "Results, caveats", page: 11, quote: "it will be important to further investigate these results and validate them with estimates of in situ growth rates, photophysiology, microzooplankon growth and grazing rates" }
    status: verified
  - id: C59
    text: "Within the diverse WAP communities, as few as 2 to 3 key OTUs explain a significant proportion of the spatial variability in carbon export potential."
    kind: result
    source: { locator: "Conclusion", page: 12, quote: "as few as 2 to 3 key OTUs can explain a significant proportion of the spatial variability in carbon export potential" }
    status: verified
  - id: C60
    text: "Using specific OTUs instead of broad functional groups raised the variance explained from 35% to 92% for NCP and from 16% to 76% for NCP/POC."
    kind: result
    source: { locator: "Conclusion", page: 12, quote: "Using specific OTUs, as opposed to broad functional groups, substantially improved our ability to explain NCP variance from 35% to 92%, and NCP/POC variance from 16% to 76%" }
    status: verified
  - id: C61
    text: "The PFT currency needs to be adjusted to the biogeochemical process or element under study."
    kind: interpretation
    source: { locator: "Conclusion", page: 12, quote: "These results suggest that the PFT currency needs to be adjusted based on the biogeochemical process or element under study" }
    status: verified
  - id: C62
    text: "Functional-group studies should be interpreted with caution, as the relation of carbon fluxes to taxonomy is more nuanced than currently depicted."
    kind: interpretation
    source: { locator: "Conclusion", page: 12, quote: "functional group level studies should be interpreted with caution as the relation of organic carbon fluxes to taxonomy is more nuanced than currently depicted" }
    status: verified
  - id: C63
    text: "Microzooplankton (dinoflagellates and Rhizaria) arose as important negative predictors of carbon export potential."
    kind: result
    source: { locator: "Conclusion", page: 12, quote: "Microzooplankton (i.e., dinoflagellates and Rhizaria) also arose as important negative predictors of carbon export potential" }
    status: verified
  - id: C64
    text: "Ecosystems with lower export potential have more tightly coupled communities."
    kind: result
    source: { locator: "Abstract", page: 1, quote: "ecosystems with lower export potential have more tightly coupled communities" }
    status: verified
  - id: C65
    text: "Normalising NCP to POC gives a qualitative measure of how productive the ecosystem is for a given amount of surface biomass."
    kind: method
    source: { locator: "Results, caveats", page: 11, quote: "Normalizing NCP to POC provides us with a qualitative approach to evaluate how productive the ecosystem is for a given amount of biomass at the ocean surface" }
    status: verified
  - id: C66
    text: "The O2/Ar method suits relating NCP to plankton assemblages because the O2 residence time is comparable to the plankton community turnover time."
    kind: method
    source: { locator: "Materials and Methods, paragraph 1", page: 13, quote: "The O2/Ar method is suitable to explore the relation of NCP to plankton assemblages because the O2 residence time in this study is comparable to plankton community turnover time" }
    status: verified
