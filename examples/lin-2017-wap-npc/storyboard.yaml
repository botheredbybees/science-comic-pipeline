        y: 0.55
        w: 0.96
        h: 0.38
        items:
        - label: seawater line
        - label: 18S DNA
        - label: who is there
  - id: B2.2
    weight: standard
    transition: scene-to-scene
    word_picture: parallel
    scene: 'Two bars on a scale of days: how long oxygen stays in the mixed layer, and how long a plankton community takes to change.'
    speech:
    - speaker: narrator
      kind: caption
      text: Oxygen stays in the mixed layer 8 to 19 days, 11 on average, within the 1 week to 1 month it takes the plankton community to change. So the two can be compared.
