    scene: 'Two pipes from the same seawater line: one carries oxygen and argon to a mass spectrometer, the other carries DNA to a sequencer.'
    speech:
    - speaker: narrator
      kind: caption
      text: The study combines underway O2/Ar, which estimates net community production, with 18S ribosomal DNA sequencing.
    claim_ids:
    - C9
    - C10
