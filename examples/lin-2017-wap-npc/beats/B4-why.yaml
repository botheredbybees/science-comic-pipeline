  - id: B4
    title: "Why these suspects?"
    act: result
    panels:
      - id: B4.1
        weight: wide
        transition: scene-to-scene
        scene: "Dot, tiny, stands next to two huge diatoms. They tower over him."
        speech:
          - { speaker: narrator, kind: caption, text: "Cultured isolates showed F. cylindrus has a significantly higher maximum growth rate (P < 0.05) than Proboscia alata and Actinocyclus actinochilus, yet it does not correlate with NCP." }
          - { speaker: dot, text: "I grow faster." }
        claim_ids: [C42]
        humour:
          note: "Dot's growth rate does not buy him a prediction."
          keeps_claims_intact: true
        staging:
          characters:
            - { id: dot, x: 0.2, pose: up, face: smile, scale: 0.45 }
            - { id: extra, x: 0.55, scale: 1.4, face: neutral }
            - { id: extra, x: 0.85, scale: 1.4, face: neutral }
          props:
            - { kind: label, x: 0.2, y: 0.12, label: "F. cylindrus", size: small }
            - { kind: label, x: 0.55, y: 0.07, label: "P. alata", size: small }
            - { kind: label, x: 0.85, y: 0.07, label: "A. actinochilus", size: small }
      - id: B4.2
        weight: standard
        frame: borderless
        transition: subject-to-subject
        scene: "A scale with two pans: growth rate on one side, nearly level; cell volume on the other, hugely lopsided."
        speech:
          - { speaker: narrator, kind: caption, text: "Growth rates of the three diatoms varied by less than 2-fold, but the biovolume of P. alata and A. actinochilus is more than two orders of magnitude larger." }
        claim_ids: [C43, C44]
        staging:
          props:
            - { kind: bars, x: 0.1, y: 0.04, w: 0.8, h: 0.9, max: 120, show_values: false, bars: [{ label: "growth rate", value: 40, style: hollow }, { label: "growth rate, big diatom", value: 60, style: hollow }, { label: "cell volume, small", value: 4 }, { label: "cell volume, big", value: 110 }] }
      - id: B4.3
        weight: standard
        transition: scene-to-scene
        scene: "A large, heavy diatom sinks fast past a slow grazer that cannot keep up."
        speech:
          - { speaker: narrator, kind: caption, text: "Large size could directly raise sinking rates and export, or uncouple cells from slow-growing grazers." }
        claim_ids: [C45]
        staging:
          characters:
            - { id: extra, x: 0.3, y: 0.7, scale: 1.1, face: smile }
            - { id: gyro, x: 0.78, y: 0.9, scale: 0.7, pose: shrug, face: worry, facing: left }
          props:
            - { kind: arrow, x: 0.55, y: 0.1, x2: 0.55, y2: 0.8 }
      - id: B4.4
        weight: standard
        frame: borderless
        transition: scene-to-scene
        scene: "A tortoise and a hare of the plankton world: one stays put and tolerates stress; one booms and then busts."
        speech:
          - { speaker: narrator, kind: caption, text: "Persistent species are better at stress tolerance. When conditions turn favourable, boom-and-bust species can outpace grazer growth and contribute to more efficient export." }
        claim_ids: [C46, C47]
        staging:
          characters:
            - { id: dot, x: 0.25, pose: stand, face: deadpan, scale: 0.85 }
            - { id: extra, x: 0.75, pose: up, face: surprised, facing: left }
          props:
            - { kind: label, x: 0.25, y: 0.1, label: "persistent", size: small }
            - { kind: label, x: 0.75, y: 0.1, label: "boom and bust", size: small }
      - id: B4.5
        weight: wide
        transition: scene-to-scene
        scene: "Two networks of nodes and lines: one dense and tangled, one sparse. A bar chart compares their edges."
        speech:
          - { speaker: narrator, kind: caption, text: "Low NCP/POC communities had almost double the network edges of high NCP/POC communities, 496 against 262, each built from only 11 stations. That suggests tighter coupling." }
        claim_ids: [C48, C49, C50]
        staging:
          props:
            - { kind: bars, x: 0.15, y: 0.04, w: 0.7, h: 0.9, max: 520, show_max: false, bars: [{ label: "low NCP/POC", value: 496 }, { label: "high NCP/POC", value: 262, style: hollow }] }
      - id: B4.6
        weight: standard
        frame: borderless
        transition: subject-to-subject
        scene: "A knot of organisms holding hands, all tangled together, labelled 'tightly coupled'. Beside it, a spread-out line labelled 'loose'."
        speech:
          - { speaker: narrator, kind: caption, text: "This may support the paradigm that more tightly coupled ecosystems are less efficient exporters of carbon." }
        claim_ids: [C51, C64]
        staging:
          characters:
            - { id: extra, x: 0.1, scale: 0.6, face: worry }
            - { id: extra, x: 0.2, scale: 0.6, face: worry }
            - { id: extra, x: 0.3, scale: 0.6, face: worry }
            - { id: extra, x: 0.62, scale: 0.6, face: smile }
            - { id: extra, x: 0.92, scale: 0.6, face: smile }
          props:
            - { kind: label, x: 0.2, y: 0.12, label: "tightly coupled", size: small }
            - { kind: label, x: 0.77, y: 0.12, label: "loose", size: small }

  - id: B5
    title: "Caveats, and what next"
    act: discussion
    panels:
      - id: B5.1
        weight: standard
        transition: scene-to-scene
        scene: "A wobbly chart. Ines squints at it."
        speech:
          - { speaker: narrator, kind: caption, text: "A lack of steady state in the mixed-layer carbon budget may blur some of the relationships." }
        claim_ids: [C55]
        staging:
          characters:
            - { id: ines, x: 0.25, pose: think, face: deadpan, facing: right }
          props:
            - { kind: plot, x: 0.5, y: 0.1, w: 0.46, h: 0.8, series: [{ points: [[0, 0.3], [0.2, 0.6], [0.4, 0.4], [0.6, 0.7], [0.8, 0.5], [1, 0.8]], style: dotted }] }
      - id: B5.2
        weight: standard
        frame: borderless
        transition: subject-to-subject
        scene: "A sequencer printout next to a hand counter. They disagree."
        speech:
          - { speaker: narrator, kind: caption, text: "16S and 18S reads differ from taxon-specific cell counts, partly because rDNA copy numbers vary per cell." }
        claim_ids: [C56]
        staging:
          props:
            - { kind: box, x: 0.08, y: 0.25, w: 0.38, h: 0.4, label: "reads" }
            - { kind: box, x: 0.54, y: 0.25, w: 0.38, h: 0.4, label: "cell counts" }
      - id: B5.3
        weight: standard
        transition: moment-to-moment
        scene: "Ines holds up a finger. Dot, in a deerstalker hat, has already named a culprit."
        speech:
          - { speaker: narrator, kind: caption, text: "The network and correlation analyses do not necessarily reflect direct causal ecological relationships." }
          - { speaker: ines, text: "Correlation, Dot." }
        claim_ids: [C57]
        humour:
          note: "A reminder to the detective."
          keeps_claims_intact: true
        staging:
          characters:
            - { id: ines, x: 0.2, pose: point, face: deadpan, facing: right }
            - { id: dot, x: 0.8, pose: shrug, face: smile, facing: left }
      - id: B5.4
        weight: wide
        frame: borderless
        transition: scene-to-scene
        scene: "Ines, on the next voyage, carrying a small instrument with a flash lamp. Dot backs away."
        speech:
          - { speaker: narrator, kind: caption, text: "The authors say it will be important to validate the results with in situ growth rates, photophysiology, and microzooplankton growth and grazing rates." }
          - { speaker: ines, text: "Photophysiology? I know a flash for that." }
          - { speaker: dot, text: "Please don't." }
        claim_ids: [C58]
        humour:
          note: "A cross-reference to the fluorescence comic; the paper itself does not mention that instrument."
          keeps_claims_intact: true
        staging:
          characters:
            - { id: ines, x: 0.25, pose: up, face: smile, facing: right }
            - { id: dot, x: 0.8, pose: shrug, face: worry, facing: left }
          props:
            - { kind: flash, x: 0.45, y: 0.15, w: 0.2, h: 0.4, label: "FLASH" }
      - id: B5.5
        weight: wide
        transition: scene-to-scene
        scene: "Two bar pairs, before and after: broad groups against specific OTUs, for NCP and NCP/POC."
        speech:
          - { speaker: narrator, kind: caption, text: "As few as 2 to 3 key OTUs explain a significant share of the spatial variability in carbon export potential. Using OTUs instead of broad groups raised the variance explained from 35% to 92% for NCP and from 16% to 76% for NCP/POC." }
        claim_ids: [C59, C60]
        staging:
          props:
            - { kind: bars, x: 0.04, y: 0.04, w: 0.92, h: 0.92, max: 100, unit: "%", bars: [{ label: "groups, NCP", value: 35, style: hollow }, { label: "OTUs, NCP", value: 92 }, { label: "groups, NCP/POC", value: 16, style: hollow }, { label: "OTUs, NCP/POC", value: 76 }] }
      - id: B5.6
        weight: standard
        transition: scene-to-scene
        scene: "Ines relabels the tidy boxes. Gyrodinium reads over her shoulder, interested."
        speech:
          - { speaker: narrator, kind: caption, text: "The PFT currency needs adjusting to the process under study. Microzooplankton, dinoflagellates and Rhizaria, emerged as important negative predictors, and functional-group studies should be read with caution." }
        claim_ids: [C61, C62, C63]
        staging:
          characters:
            - { id: ines, x: 0.2, pose: point, face: smile, facing: right }
            - { id: gyro, x: 0.8, pose: hold, face: smile, facing: left, scale: 0.9 }
          props:
            - { kind: board, x: 0.35, y: 0.15, w: 0.4, h: 0.5, cards: [{ label: "PFT" }] }
      - id: B5.7
        weight: full
        frame: borderless
        transition: scene-to-scene
        word_picture: picture-specific
        scene: "Night on deck. Ines looks at the sea. Beside her Dot sits, glowing slightly, still convinced he is important."
        speech:
          - { speaker: dot, text: "Most abundant. Best predictor. Surely." }
          - { speaker: ines, text: "Surely not." }
        humour:
          note: "Back to the punchline: abundance is not prediction."
          keeps_claims_intact: true
        staging:
          characters:
            - { id: dot, x: 0.3, pose: up, face: smile, facing: right }
            - { id: ines, x: 0.7, pose: shrug, face: smile, facing: left }
