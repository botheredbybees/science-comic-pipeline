  - id: B1
    title: "The pump"
    act: problem
    panels:
      - id: B1.1
        weight: wide
        scene: "The ship on a grey sea. Ines, in her woolly hat, writes an equation on a clipboard."
        speech:
          - { speaker: narrator, kind: caption, text: "Net community production, NCP, is gross primary production minus community respiration." }
        claim_ids: [C1]
        staging:
          characters:
            - { id: ines, x: 0.25, pose: hold, holding: paper, face: neutral, facing: right }
          props:
            - { kind: ship, x: 0.5, y: 0.25, w: 0.42, h: 0.6 }
      - id: B1.2
        weight: standard
        frame: borderless
        transition: scene-to-scene
        scene: "A cell at the surface. One arrow loops back up to the sunlit layer, another heads down into the dark."
        speech:
          - { speaker: narrator, kind: caption, text: "What the plankton make is either recycled or exported to depth, depending on their size and density." }
        claim_ids: [C2]
        staging:
          props:
            - { kind: box, x: 0.3, y: 0.32, w: 0.4, h: 0.2, label: "plankton" }
            - { kind: arrow, x: 0.5, y: 0.3, x2: 0.5, y2: 0.14 }
            - { kind: label, x: 0.5, y: 0.1, label: "recycled", size: small }
            - { kind: arrow, x: 0.5, y: 0.54, x2: 0.5, y2: 0.84 }
            - { kind: label, x: 0.5, y: 0.97, label: "exported", size: small }
      - id: B1.3
        weight: standard
        transition: subject-to-subject
        scene: "Four tidy boxes on a board. Ines taps them. Dot looks unconvinced."
        speech:
          - { speaker: narrator, kind: caption, text: "Export is modelled as a function of plankton functional types: picoautotrophs, diazotrophs, calcifiers and silicifiers such as diatoms." }
          - { speaker: ines, text: "Models like tidy boxes." }
        claim_ids: [C3, C4]
        humour:
          note: "Ines, on tidy boxes."
          keeps_claims_intact: true
        staging:
          characters:
            - { id: ines, x: 0.13, pose: point, face: smile, facing: right, scale: 0.85 }
          props:
            - { kind: board, x: 0.3, y: 0.15, w: 0.68, h: 0.6, cards: [{ label: "pico" }, { label: "diazo" }, { label: "calc" }, { label: "silic" }] }
      - id: B1.4
        weight: standard
        frame: borderless
        transition: subject-to-subject
        scene: "Dot, in a heavy glass shell, sinks like a stone and looks pleased about it."
        speech:
          - { speaker: narrator, kind: caption, text: "Most diatoms are believed to be efficient exporters because of their large size and heavy silica shells." }
          - { speaker: dot, text: "Heavy shell. Down I go." }
        claim_ids: [C5]
        staging:
          characters:
            - { id: dot, x: 0.5, y: 0.7, pose: up, face: smile }
          props:
            - { kind: arrow, x: 0.82, y: 0.25, x2: 0.82, y2: 0.88 }
            - { kind: label, x: 0.82, y: 0.15, label: "sinks", size: small }
      - id: B1.5
        weight: standard
        transition: scene-to-scene
        scene: "Ines shrugs at a chart with a large question mark where the organisms should be."
        speech:
          - { speaker: narrator, kind: caption, text: "But there is little understanding of how biodiversity influences the carbon pump beyond broad paradigms such as diatoms contributing disproportionally to export." }
          - { speaker: ines, text: "We mostly assume." }
        claim_ids: [C6]
        staging:
          characters:
            - { id: ines, x: 0.25, pose: shrug, face: deadpan, facing: right }
          props:
            - { kind: label, x: 0.55, y: 0.5, label: "?", size: large }
      - id: B1.6
        weight: wide
        frame: borderless
        transition: scene-to-scene
        scene: "A map of the Antarctic Peninsula with a small canary sitting on it. Ines points."
        speech:
          - { speaker: narrator, kind: caption, text: "The Western Antarctic Peninsula may be the canary in a coal mine of the Southern Ocean." }
        claim_ids: [C7]
        staging:
          characters:
            - { id: ines, x: 0.2, pose: point, face: smile, facing: right }
            - { id: extra, x: 0.86, y: 0.9, scale: 0.4, face: worry }
          props:
            - { kind: label, x: 0.86, y: 0.45, label: "canary", size: small }
            - { kind: box, x: 0.4, y: 0.1, w: 0.3, h: 0.6, label: "WAP" }
      - id: B1.7
        weight: wide
        transition: subject-to-subject
        scene: "A line of animals along the bottom of the panel: krill, a fish, a penguin, a seal, a whale. They look at the thermometer."
        speech:
          - { speaker: narrator, kind: caption, text: "Production at the base of the food chain, and upper levels such as krill, fish, penguins, seals and whales, are likely to be affected by rapid warming and sea ice loss." }
        claim_ids: [C8]
        staging:
          characters:
            - { id: extra, x: 0.1, scale: 0.55, face: worry }
            - { id: extra, x: 0.28, scale: 0.7, face: worry }
            - { id: extra, x: 0.46, scale: 0.85, face: worry }
            - { id: extra, x: 0.64, scale: 1.0, face: worry }
            - { id: extra, x: 0.84, scale: 1.2, face: worry }
          props:
            - { kind: label, x: 0.1, y: 0.2, label: "krill", size: small }
            - { kind: label, x: 0.46, y: 0.2, label: "penguin", size: small }
            - { kind: label, x: 0.84, y: 0.2, label: "whale", size: small }
