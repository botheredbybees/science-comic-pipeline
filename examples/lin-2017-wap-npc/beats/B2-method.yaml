  - id: B2
    title: "The method"
    act: method
    panels:
      - id: B2.1
        weight: wide
        transition: scene-to-scene
        scene: "Two pipes from the same seawater line: one carries oxygen and argon to a mass spectrometer, the other carries DNA to a sequencer."
        speech:
          - { speaker: narrator, kind: caption, text: "The study combines underway O2/Ar, which estimates net community production, with 18S ribosomal DNA sequencing." }
        claim_ids: [C9, C10]
        staging:
          props:
            - { kind: flow, x: 0.02, y: 0.08, w: 0.96, h: 0.38, items: [{ label: "seawater line" }, { label: "O2/Ar" }, { label: "NCP" }] }
            - { kind: flow, x: 0.02, y: 0.55, w: 0.96, h: 0.38, items: [{ label: "seawater line" }, { label: "18S DNA" }, { label: "who is there" }] }
      - id: B2.2
        weight: standard
        transition: scene-to-scene
        word_picture: parallel
        scene: "Two bars on a scale of days: how long oxygen stays in the mixed layer, and how long a plankton community takes to change."
        speech:
          - { speaker: narrator, kind: caption, text: "Oxygen stays in the mixed layer 8 to 19 days, 11 on average, within the 1 week to 1 month it takes the plankton community to change. So the two can be compared." }
        claim_ids: [C11, C12, C66]
        staging:
          props:
            - { kind: axis, x: 0.02, y: 0.1, w: 0.96, h: 0.8, items: [{ at: 0.2, to: 0.5, label: "O2 residence: 8-19 days" }, { at: 0.18, to: 0.8, label: "community change: 1 week to 1 month", row: 1, style: hollow }] }
      - id: B2.3
        weight: standard
        frame: borderless
        transition: scene-to-scene
        scene: "Ines on the deck of the R/V Laurence M. Gould, in the cold."
        speech:
          - { speaker: narrator, kind: caption, text: "Samples were collected on the annual Palmer LTER cruise, January to early February 2014, aboard the R/V Laurence M. Gould." }
        claim_ids: [C13]
        staging:
          characters:
            - { id: ines, x: 0.25, pose: hold, holding: mug, face: neutral, facing: right }
          props:
            - { kind: ship, x: 0.5, y: 0.3, w: 0.45, h: 0.55 }
      - id: B2.4
        weight: wide
        transition: scene-to-scene
        scene: "A seawater line runs past a filter holder and a row of sensors."
        speech:
          - { speaker: narrator, kind: caption, text: "Seawater from the ship's supply line was gently filtered through 0.2 µm filters for DNA, while temperature, salinity, oxygen, fluorescence and NCP were measured underway from the same clean flow-through line." }
        claim_ids: [C14, C15]
        staging:
          props:
            - { kind: flow, x: 0.02, y: 0.1, w: 0.96, h: 0.45, items: [{ label: "seawater line" }, { label: "0.2 µm filter" }, { label: "DNA" }] }
            - { kind: label, x: 0.5, y: 0.82, label: "temperature, salinity, oxygen, fluorescence, NCP", size: small }
      - id: B2.5
        weight: standard
        frame: borderless
        transition: scene-to-scene
        scene: "A row of 21 little filters in a rack. Ines holds the last one up to the light."
        speech:
          - { speaker: narrator, kind: caption, text: "DNA was extracted from 21 stations and the V4 region of the 18S gene was sequenced." }
        claim_ids: [C16]
        staging:
          characters:
            - { id: ines, x: 0.2, pose: up, face: smile, facing: right }
          props:
            - { kind: box, x: 0.45, y: 0.3, w: 0.5, h: 0.4, label: "21 stations" }
      - id: B2.6
        weight: standard
        transition: subject-to-subject
        scene: "A fraction: NCP over POC. Dot asks what it is for."
        speech:
          - { speaker: narrator, kind: caption, text: "To account for biomass, NCP was normalised to particulate organic carbon, POC. That may indicate how fast the carbon inventory sinks and turns over." }
          - { speaker: dot, text: "Per unit of me, please." }
        claim_ids: [C17, C18, C65]
        humour:
          note: "Dot is the biomass."
          keeps_claims_intact: true
        staging:
          characters:
            - { id: dot, x: 0.82, pose: shrug, face: smile, facing: left, scale: 0.85 }
          props:
            - { kind: label, x: 0.35, y: 0.5, label: "NCP / POC", size: large }
      - id: B2.7
        weight: standard
        transition: scene-to-scene
        scene: "A crowd of small, different organisms, far too many to count. A sign reads '464'."
        speech:
          - { speaker: narrator, kind: caption, text: "At a 97% DNA similarity threshold, roughly species to genus, there were 464 operational taxonomic units, OTUs." }
        claim_ids: [C19]
        staging:
          characters:
            - { id: extra, x: 0.12, scale: 0.55, face: smile }
            - { id: extra, x: 0.26, scale: 0.55 }
            - { id: extra, x: 0.4, scale: 0.55, face: worry }
            - { id: extra, x: 0.54, scale: 0.55, face: smile }
            - { id: extra, x: 0.68, scale: 0.55 }
            - { id: extra, x: 0.82, scale: 0.55, face: surprised }
          props:
            - { kind: sign, x: 0.38, y: 0.02, w: 0.24, h: 0.4, label: "464 OTUs" }
      - id: B2.8
        weight: wide
        frame: borderless
        transition: scene-to-scene
        scene: "Ines checks her sums on the back of a clipboard."
        speech:
          - { speaker: narrator, kind: caption, text: "Checks: NCP from O2/Ar correlates highly with NCP from seasonal DIC drawdown (r2 = 0.83). The estimated change in POC averaged 18% of NCP, though that used only 4 comparisons because of cloud cover." }
        claim_ids: [C52, C53, C54]
        staging:
          characters:
            - { id: ines, x: 0.25, pose: think, face: neutral, facing: right }
          props:
            - { kind: paper, x: 0.55, y: 0.1, w: 0.3, h: 0.75, label: "check" }
