claims:
# ---- background (Introduction) ----
- id: C1
  text: "The Southern Ocean disproportionally contributes to the global climate system, accounting for almost half of the anthropogenic CO2 and 75% of the heat uptake by the oceans."
  kind: background
  source:
    locator: "Introduction, paragraph 1"
    page: 3
    quote: "accounting for almost half of the anthropogenic CO2 and 75% of the heat uptake by the oceans"
  status: verified
  note: "Paper's own wording; the sentence does not say 'of the CO2 uptake', so do not add 'uptake' to the CO2 half."
- id: C2
  text: "The Western Antarctic Peninsula system has exhibited some of the most significant changes in the Southern Ocean, with rising air temperature up to 7 °C since 1950."
  kind: background
  source:
    locator: "Introduction, paragraph 1"
    page: 3
    quote: "The Western Antarctic Peninsula (WAP) system has exhibited some of the most significant changes in the Southern Ocean,, with rising air temperature up to 7 °C since 1950"
  status: verified
- id: C3
  text: "The Western Antarctic Peninsula has seen the fastest sea ice decrease in Antarctica."
  kind: background
  source:
    locator: "Introduction, paragraph 1"
    page: 3
    quote: "deepening of the mixed layer depth (MLD), and the fastest sea ice decrease in Antarctica"
  status: verified
- id: C4
  text: "WAP eukaryotic plankton including phytoplankton and microzooplankton support higher trophic levels ranging from krill to penguins and whales."
  kind: background
  source:
    locator: "Introduction, paragraph 1"
    page: 3
    quote: "WAP eukaryotic plankton including phytoplankton and microzooplankton support higher trophic levels ranging from krill to penguins and whales"
  status: verified
- id: C5
  text: "Given the fundamental importance of eukaryotic plankton at the WAP, it is imperative to understand and predict the changes in plankton community structure, biodiversity, and carbon flux in this rapidly changing environment."
  kind: background
  source:
    locator: "Introduction, paragraph 1"
    page: 3
    quote: "given the fundamental importance of eukaryotic plankton at the WAP, it is imperative to understand and predict the changes in plankton community structure, biodiversity, and carbon flux in this rapidly changing environment"
  status: verified
- id: C6
  text: "The net community production (NCP) represents the balance between gross primary production and community respiration."
  kind: background
  source:
    locator: "Introduction, paragraph 2"
    page: 5
    quote: "The net community production (NCP) represents the balance between gross primary production and community respiration"
  status: verified
  note: "Definition claim (paper's own gloss of NCP)."
- id: C7
  text: "When the organic carbon pool in the mixed layer is in a steady state, NCP equals the net carbon flux out (carbon export), so NCP reflects the organic carbon available for export out of the surface mixed layer depth (MLD)."
  kind: background
  source:
    locator: "Introduction, paragraph 2"
    page: 5
    quote: "When the organic carbon pool at the mixed layer is under a steady state, the net carbon flux in (i.e., NCP) equals the net carbon flux out (i.e., carbon export). Therefore, NCP reflects the amount of organic carbon available for export out of the surface MLD"
  status: verified
  note: "Only under a steady state. NCP is available for export, not measured export."
- id: C8
  text: "The WAP system is characterized by a short but highly productive growing season during austral spring and summer."
  kind: background
  source:
    locator: "Introduction, paragraph 2"
    page: 5
    quote: "The WAP system is characterized by a short but highly productive growing season during austral spring and summer"
  status: verified
- id: C9
  text: "In previous studies, elevated NCP or primary production under high sea-ice conditions were attributed to ice-melt enhanced water column stability, thus higher light availability, and potential iron supplied by sea ice."
  kind: background
  source:
    locator: "Results and discussion, paragraph 1"
    page: 7
    quote: "In previous studies, elevated NCP or primary production under high sea-ice conditions were attributed to ice-melt enhanced water column stability, thus higher light availability, and potential iron supplied by sea ice"
  status: verified
  note: "Cited work, not this paper's finding. Do not name the studies."

# ---- methods ----
- id: C10
  text: "The authors analyze five years of high-resolution NCP and high-throughput DNA sequencing data to explore the contribution of polar eukaryotic plankton to biological carbon fluxes."
  kind: method
  source:
    locator: "Introduction, paragraph 3"
    page: 6
    quote: "we analyze five years of high-resolution NCP and high-throughput DNA sequencing data to explore the contribution of polar eukaryotic plankton to biological carbon fluxes"
  status: verified
- id: C11
  text: "Each year in January, a research vessel conducted intensive oceanographic and biological surveys across the shelf-transects and a north-south gradient at the West Antarctic Peninsula."
  kind: method
  source:
    locator: "Methods, Environmental data and DNA sampling, paragraph 1"
    page: 20
    quote: "each year in January, a research vessel conducted intensive oceanographic and biological surveys across the shelf-transects and a north−south gradient at the West Antarctic Peninsula (WAP)"
  status: verified
- id: C12
  text: "Surface seawater from the ship's underway flow-through system was gently vacuum-filtered onto a 0.45 µm Supor filter for years 2012 and 2013, or a 0.2 µm Supor filter for years 2014, 2015, and 2016."
  kind: method
  source:
    locator: "Methods, Environmental data and DNA sampling, paragraph 4"
    page: 23
    quote: "surface seawater from the ship’s underway flow-through system was gently vacuum-filtered onto a 47 mm, 0.45 µm Supor filter (Pall Corporation, New York, NY, USA) for years 2012 and 2013, or a 47 mm, 0.2 µm Supor filter for years 2014, 2015, and 2016"
  status: verified
  note: "The filter changed between years; the paper does not discuss whether this matters."
- id: C13
  text: "The filters were immediately stored at −80 °C until further analysis."
  kind: method
  source:
    locator: "Methods, Environmental data and DNA sampling, paragraph 4"
    page: 23
    quote: "The filters were immediately stored at −80 °C until further analysis"
  status: verified
- id: C14
  text: "The authors explored the plankton community structure and diversity via sequencing of the 18S rRNA gene marker, based on a five-year WAP DNA sampling."
  kind: method
  source:
    locator: "Results and discussion, paragraph 2"
    page: 9
    quote: "Based on a five-year WAP DNA sampling, we explored the plankton community structure and diversity via sequencing of the 18S rRNA gene marker"
  status: verified
- id: C15
  text: "At the finest taxonomic resolution, 2480 amplicon sequence variants (ASVs) were identified from the five-year amplicon dataset (119 samples)."
  kind: method
  source:
    locator: "Results and discussion, paragraph 3"
    page: 10
    quote: "At the finest taxonomic resolution, 2480 amplicon sequence variants (ASVs) were identified from the five-year amplicon dataset (119 samples)"
  status: verified
  note: "Sample count conflicts inside the paper: 119 here, 117 after discarding two (Methods, Alpha diversity), 112 in the WGCNA and GP runs. See CLAIM-CHECK.md."
- id: C16
  text: "Seawater O2/Ar ratios were measured underway from the ship's flow-through system, using an equilibrator inlet mass spectrometer (EIMS)."
  kind: method
  source:
    locator: "Methods, Underway O2/Ar—NCP measurements, paragraph 1"
    page: 25
    quote: "Seawater O2/Ar ratios were measured underway from the ship’s flow-through system, using an equilibrator inlet mass spectrometer (EIMS)"
  status: verified
- id: C17
  text: "Using Ar, an inert gas with similar solubility properties as O2, the authors decomposed total O2 into physical and biological components."
  kind: method
  source:
    locator: "Methods, Underway O2/Ar—NCP measurements, paragraph 1"
    page: 25
    quote: "Using Ar, an inert gas with similar solubility properties as O2, we decomposed total O2 into physical and biological components"
  status: verified
- id: C18
  text: "The ship-based O2/Ar NCP estimates are highly correlated with NCP calculated from the seasonal DIC drawdown in this region (R2 = 0.83)."
  kind: method
  source:
    locator: "Methods, Underway O2/Ar—NCP measurements, paragraph 2"
    page: 26
    quote: "the ship-based O2/Ar NCP estimates are highly correlated with NCP calculated from the seasonal DIC drawdown in this region (R2 = 0.83)"
  status: verified
  note: "The correlation is with a cited earlier study's comparison, not new to this paper."
- id: C19
  text: "The O2/Ar-NCP measurements in this study only reflect the mixed layer carbon fluxes and the authors do not assess the sequestration timescales."
  kind: caveat
  source:
    locator: "Methods, Underway O2/Ar—NCP measurements, paragraph 2"
    page: 26
    quote: "Note that our O2/Ar-NCP measurements in this study only reflect the mixed layer carbon fluxes and we do not assess the sequestration timescales"
  status: verified
- id: C20
  text: "The authors applied a weighted gene correlation network analysis (WGCNA) approach to delineate clusters of 18S ASVs into subnetworks or modules."
  kind: method
  source:
    locator: "Results and discussion, paragraph 5"
    page: 14
    quote: "we applied a weighted gene correlation network analysis (WGCNA) approach to delineate clusters of 18S ASVs into subnetworks or modules"
  status: verified
  note: "Definition claim for WGCNA and 'module'."
- id: C21
  text: "Each module represents an assemblage of predicted highly interconnected plankton community members, potentially indicating a group of organisms with strong ecological overlap and/or interactions."
  kind: method
  source:
    locator: "Results and discussion, paragraph 5"
    page: 14
    quote: "Each module represents an assemblage of predicted highly interconnected plankton community members, potentially indicating a group of organisms with strong ecological overlap and/or interactions"
  status: verified
- id: C22
  text: "In total, the authors identified 12 modules from the five-year global community structure."
  kind: result
  source:
    locator: "Results and discussion, paragraph 5"
    page: 14
    quote: "In total, we identified 12 modules from the five-year global community structure"
  status: verified
- id: C23
  text: "Genetic Programming (GP) is a machine learning approach based on evolution computation."
  kind: method
  source:
    locator: "Results and discussion, paragraph 5"
    page: 14
    quote: "Genetic Programming (GP), a machine learning approach based on evolution computation"
  status: verified
  note: "Definition claim for GP."
- id: C24
  text: "GP allows the authors to capture the complex and non-linear relationships between these different factors to predict NCP without an a priori assumption."
  kind: method
  source:
    locator: "Results and discussion, paragraph 5"
    page: 14
    quote: "GP allows us to capture the complex and non-linear relationships between these different factors to predict NCP without an a priori assumption"
  status: verified
- id: C25
  text: "The GP models predict NCP based on the WGCNA generated bio-assemblages (n = 12) and physical factors (n = 6)."
  kind: method
  source:
    locator: "Results and discussion, paragraph 5"
    page: 14
    quote: "based on the WGCNA generated bio-assemblages (n = 12) and physical factors (n = 6)"
  status: unverified
  note: "Conflict: the Methods list nine physical factors (MLD, PAR, PAR_mld, Salinity, SST, fsim, fmet, X grid, Y grid). Never drawn. See CLAIM-CHECK.md."
- id: C26
  text: "The combined dataset (n = 112) was randomly split into even training and validation datasets."
  kind: method
  source:
    locator: "Methods, Construct statistical models for NCP, Genetic programming to build NCP models, paragraph 1"
    page: 38
    quote: "The combined dataset (n = 112) was randomly split into even training and validation datasets"
  status: verified

- id: C27
  text: "Due to the high dimensionality of the ASV dataset, it is challenging to model NCP based on community structure."
  kind: background
  source:
    locator: "Results and discussion, paragraph 5"
    page: 14
    quote: "Due to the high dimensionality of the ASV dataset, it is challenging to model NCP based on community structure"
  status: verified

# ---- results ----
- id: C30
  text: "During the summer, NCP was highest in the shelf zone and decreased offshore."
  kind: result
  source:
    locator: "Results and discussion, paragraph 1"
    page: 7
    quote: "During the summer, NCP was highest in the shelf zone and decreased offshore"
  status: verified
- id: C31
  text: "The two years that feature late sea-ice retreat (2014 and 2016) were associated with abnormally high summer NCP (t-test, p < 0.0001)."
  kind: result
  source:
    locator: "Results and discussion, paragraph 1"
    page: 7
    quote: "The two years that feature late sea-ice retreat (2014 and 2016) were associated with abnormally high summer NCP (t-test, p < 0.0001)"
  status: verified
  note: "Associated, not caused. The text says 'late retreat'; the next section calls the same years 'high sea ice'."
- id: C32
  text: "The five years studied (2012 to 2016) were a period of moderately positive sea-ice area anomalies following a more prolonged period of anomalously low sea-ice area."
  kind: caveat
  source:
    locator: "Results and discussion, paragraph 1"
    page: 7
    quote: "observations at the WAP in austral summer from 2012 to 2016 demonstrate substantial spatial heterogeneity and interannual variability (Fig. 2). This was a period of moderately positive sea-ice area (SIA) anomalies following a more prolonged period of anomalously low SIA"
  status: verified
  note: "Important context: the study years were not a stretch of record-low ice. The decline is inferred from year-to-year differences, not seen as a trend in the plankton data."
- id: C33
  text: "At the phylum level, four eukaryotic plankton dominated the WAP surface water, including diatoms (25.0%), cryptophytes (23.0%), dinoflagellates (19.6%), and haptophytes (11.3%)."
  kind: result
  source:
    locator: "Results and discussion, paragraph 2"
    page: 9
    quote: "At the phylum level, four eukaryotic plankton dominated the WAP surface water, including diatoms (25.0%), cryptophytes (23.0%), dinoflagellates (19.6%), and haptophytes (11.3%)"
  status: verified
  note: "Shares of 18S reads, not biomass."
- id: C34
  text: "Other eukaryotic plankton groups, mostly heterotrophic protists, contributed less than 5% of the 18S reads."
  kind: result
  source:
    locator: "Results and discussion, paragraph 2"
    page: 9
    quote: "Other eukaryotic plankton groups, mostly heterotrophic protists, contributed less than 5% of the 18S reads"
  status: verified
  note: "Ambiguous: the four main groups sum to 78.9%, so 'less than 5%' can only be per group, not all the others together."
- id: C35
  text: "For the years 2014 and 2016 with high sea ice, eukaryotic plankton communities comprised on average 39.5 ± 3.0% diatoms, 20.5 ± 1.3% dinoflagellates, 15.1 ± 6.1% cryptophytes, and 7.1 ± 2.4% haptophytes."
  kind: result
  source:
    locator: "Results and discussion, paragraph 2"
    page: 9
    quote: "For the years 2014 and 2016 with high sea ice, eukaryotic plankton communities comprised on average 39.5 ± 3.0% diatoms, 20.5 ± 1.3% dinoflagellates, 15.1 ± 6.1% cryptophytes, and 7.1 ± 2.4% haptophytes"
  status: verified
- id: C36
  text: "For warm years with less sea ice in 2012, 2013, and 2015, eukaryotic plankton communities comprised on average 28.9 ± 8.3% cryptophytes, 19.0 ± 1.6% dinoflagellates, 14.4 ± 4.4% haptophytes, and 14.0 ± 1.7% diatoms."
  kind: result
  source:
    locator: "Results and discussion, paragraph 2"
    page: 9
    quote: "In contrast, for warm years with less sea ice in 2012, 2013, and 2015, eukaryotic plankton communities comprised on average 28.9 ± 8.3% cryptophytes, 19.0 ± 1.6% dinoflagellates, 14.4 ± 4.4% haptophytes, and 14.0 ± 1.7% diatoms"
  status: verified
- id: C37
  text: "All four groups were reported as significantly different between the high-ice and low-ice years (two-sided t-test, p < 0.0001)."
  kind: result
  source:
    locator: "Results and discussion, paragraph 2"
    page: 9
    quote: "all significantly different from cold years (two-sided t-test, p < 0.0001)"
  status: unverified
  note: "Doubtful: dinoflagellates are 20.5 and 19.0 with SDs of 1.3 and 1.6, and the paper gives no sample sizes. Not drawn. See CLAIM-CHECK.md."
- id: C38
  text: "Canonical correspondence analysis (CCA) illustrates that either ice conditions or SST is the dominant driver on community structure at the ASV level."
  kind: result
  source:
    locator: "Results and discussion, paragraph 3"
    page: 10
    quote: "Canonical correspondence analysis (CCA) illustrates that either ice conditions or SST is the dominant driver on community structure at the ASV level"
  status: verified
  note: "Either/or: the analysis does not separate ice from SST. The abstract says sea-ice extent is 'a dominant factor'."
- id: C39
  text: "The first axis CCA1 (17.5% of the variance) separates samples from late (2014 and 2016) and early (2012, 2013, and 2015) ice-retreat years."
  kind: result
  source:
    locator: "Results and discussion, paragraph 3"
    page: 10
    quote: "The first axis CCA1 (17.5% of the variance) separates samples from late (2014 and 2016) and early (2012, 2013, and 2015) ice-retreat years"
  status: verified
- id: C40
  text: "The most substantial abiotic factor associated with CCA1 is SST (negatively correlated)."
  kind: result
  source:
    locator: "Results and discussion, paragraph 3"
    page: 10
    quote: "The most substantial abiotic factor associated with CCA1 is SST (negatively correlated)"
  status: verified
- id: C41
  text: "Overall, sea-ice conditions and associated environmental parameters, such as low SST and low salinity, are the primary drivers of community differentiation at the ASV level."
  kind: interpretation
  source:
    locator: "Results and discussion, paragraph 3"
    page: 10
    quote: "Overall, sea-ice conditions and associated environmental parameters, such as low SST (Fig. S1 and S2) and low salinity, are the primary drivers of community differentiation at the ASV level"
  status: verified
- id: C42
  text: "Chao1, a measure for species richness, demonstrated an evident decline towards higher SST, with a 40% decrease in the index for a 4 °C rise in SST."
  kind: result
  source:
    locator: "Results and discussion, paragraph 4"
    page: 12
    quote: "Chao1, a measure for species richness, demonstrated an evident decline towards higher SST (Fig. 4), with a 40% decrease in the index for a 4 °C rise in SST"
  status: verified
  note: "A fitted line across samples (space and years), not one place warming by 4 °C."
- id: C43
  text: "Pielou’s evenness and Shannon, which consider both species richness and evenness, also decreased significantly with increasing SST."
  kind: result
  source:
    locator: "Results and discussion, paragraph 4"
    page: 12
    quote: "Pielou’s evenness and Shannon, which consider both species richness and evenness, also decreased significantly with increasing SST"
  status: verified
- id: C44
  text: "Communities in warmer WAP waters show lower richness and lower evenness, i.e., a few taxa dominate."
  kind: interpretation
  source:
    locator: "Results and discussion, paragraph 4"
    page: 12
    quote: "communities in warmer WAP waters show lower richness and lower evenness, i.e., that a few taxa dominate"
  status: verified
- id: C45
  text: "All three diversity indices show significant negative correlations with SST (two-sided t-test, p < 0.01)."
  kind: result
  source:
    locator: "Figure 4 caption"
    page: 13
    quote: "All three diversity indices show significant negative correlations with SST (two-sided t-test, p < 0.01)"
  status: verified
- id: C46
  text: "In a recent global analysis from Tara Oceans, temperature was also the major explanatory factor for eukaryotic plankton biodiversity estimated by the Shannon index, but with the opposite trend: a decreased diversity towards higher latitude or lower temperature."
  kind: background
  source:
    locator: "Results and discussion, paragraph 4"
    page: 12
    quote: "in a recent global analysis on plankton biodiversity from Tara Oceans, the temperature was also identified as the major explanatory factor for global-scale eukaryotic plankton biodiversity estimated by the Shannon index, but with the opposite trend, i.e., a decreased diversity towards higher latitude or lower temperature"
  status: verified
  note: "Cited work, not this paper's finding."
- id: C47
  text: "The Tara Oceans dataset featured only limited sampling in the Southern Ocean (three data points)."
  kind: background
  source:
    locator: "Results and discussion, paragraph 4"
    page: 12
    quote: "it featured only limited sampling in the Southern Ocean (three data points)"
  status: verified
- id: C48
  text: "One explanation for the unexpected high biodiversity observed under low temperature at the WAP is that the ice-associated plankton communities consist mainly of diatoms, which are highly diverse and can thrive at lower temperatures compared to other phytoplankton."
  kind: interpretation
  source:
    locator: "Results and discussion, paragraph 4"
    page: 12
    quote: "One explanation for the unexpected high biodiversity observed under low temperature at the WAP is that the ice-associated plankton communities consist mainly of diatoms (Fig. S4), which are highly diverse and can thrive at lower temperatures compared to other phytoplankton"
  status: verified
- id: C49
  text: "The authors' results suggest that global warming may decrease plankton diversity in coastal Antarctica."
  kind: interpretation
  source:
    locator: "Results and discussion, paragraph 4"
    page: 12
    quote: "our results suggest that global warming may decrease plankton diversity in coastal Antarctica"
  status: verified
- id: C50
  text: "The top four GP solutions provide good predictions on NCP with R2 ranging from 0.70 to 0.80."
  kind: result
  source:
    locator: "Results and discussion, paragraph 5"
    page: 14
    quote: "The top four GP solutions (Table S2, ranked by mean square error (MSE)) provide good predictions on NCP with R2 ranging from 0.70 to 0.80"
  status: verified
  note: "The abstract's 'up to 80%' restates this. The paper does not say whether R2 is on the training or the validation half."
- id: C51
  text: "Among the explanatory variables selected by the models, the top two physical factors ranked by selection frequency are SST and MLD, followed by surface photosynthetically active radiation (PAR)."
  kind: result
  source:
    locator: "Results and discussion, paragraph 5"
    page: 14
    quote: "Among the explanatory variables selected by the models, the top two physical factors ranked by selection frequency are SST and MLD, followed by surface photosynthetically active radiation (PAR)"
  status: verified
- id: C52
  text: "This suggests that temperature and light are likely the primary physiological limiting factors on NCP in the WAP system."
  kind: interpretation
  source:
    locator: "Results and discussion, paragraph 5"
    page: 14
    quote: "This suggests that temperature and light are likely the primary physiological limiting factors on NCP in the WAP system"
  status: verified
- id: C53
  text: "SST could be an indirect proxy for time since ice-retreat, i.e., higher SST indicates a longer time after the initial ice retreat."
  kind: interpretation
  source:
    locator: "Results and discussion, paragraph 5"
    page: 14
    quote: "As an alternative, SST could be an indirect proxy for time since ice-retreat, i.e., higher SST indicates a longer time after the initial ice retreat"
  status: verified
- id: C54
  text: "Among the community-assemblage factors in GP solutions, module turquoise (MET) is the most important predictor for NCP."
  kind: result
  source:
    locator: "Results and discussion, paragraph 6"
    page: 15
    quote: "Among the community-assemblage factors in GP solutions, module turquoise (MET) is the most important predictor for NCP"
  status: verified
- id: C55
  text: "MET is also the largest module identified, which consists of 126 ASVs, mainly representing diverse groups of diatoms and dinoflagellates."
  kind: result
  source:
    locator: "Results and discussion, paragraph 6"
    page: 15
    quote: "MET is also the largest module identified, which consists of 126 ASVs, mainly representing diverse groups of diatoms and dinoflagellates"
  status: verified
- id: C56
  text: "The central nodes in the MET network, the top-10 most connected ASVs, include the diatom genera Thalassiosira, Odontella, Porosira, Actinocyclus, Proboscia, Chaetoceros, and the dinoflagellate Gyrodinium."
  kind: result
  source:
    locator: "Results and discussion, paragraph 6"
    page: 15
    quote: "The central nodes in the MET network, which represent the top-10 most connected ASVs or the central ASVs for the network structure, include the diatom genera Thalassiosira, Odontella, Porosira, Actinocyclus, Proboscia, Chaetoceros, and the dinoflagellate Gyrodinium"
  status: verified
- id: C57
  text: "MET appears in all top-four performed GP solutions, and it is the sole biological factor in solution 1 explaining a majority of the NCP variability (R2 = 0.70)."
  kind: result
  source:
    locator: "Results and discussion, paragraph 6"
    page: 15
    quote: "MET appears in all top-four performed GP solutions, and it is the sole biological factor in solution 1 explaining a majority of the NCP variability (R2 = 0.70)"
  status: verified
- id: C58
  text: "The overall spatial distributions of MET are consistent with the January averaged sea-ice distribution estimated by satellite."
  kind: result
  source:
    locator: "Results and discussion, paragraph 6"
    page: 15
    quote: "The overall spatial distributions of MET are consistent with the January averaged sea-ice distribution estimated by satellite"
  status: verified
- id: C59
  text: "MET is significantly correlated with low SST, low salinity, shallow MLD, elevated sea-ice melt and meteoric freshwater."
  kind: result
  source:
    locator: "Results and discussion, paragraph 6"
    page: 15
    quote: "MET is significantly correlated with low SST (R = −0.51, p = 1 × 10−8), low salinity (R = −0.48, p = 8 × 10−8), shallow MLD (R = −0.36, p = 1 × 10−4), elevated sea-ice melt (R = 0.33, p = 3 × 10−4) and meteoric freshwater (R = 0.34, p = 3 × 10−4)"
  status: verified
  note: "Correlations, not causes."
- id: C60
  text: "NCP (R = 0.57), ship-based primary production (R = 0.47) and bacterial production (R = 0.61) are all positively correlated with MET."
  kind: result
  source:
    locator: "Results and discussion, paragraph 6"
    page: 15
    quote: "besides NCP (R = 0.57, p = 8 × 10−11) ship-based observations of primary production (PP) and bacterial production (BP) are also both positively correlated with MET with R = 0.47, p = 1 × 10−7 and R = 0.61, p = 2 × 10−12, respectively"
  status: verified
- id: C61
  text: "This indicates that MET-dominated regions have high biological activities."
  kind: interpretation
  source:
    locator: "Results and discussion, paragraph 6"
    page: 15
    quote: "This indicates that MET-dominated regions have high biological activities"
  status: verified
- id: C62
  text: "Because iron concentrations were not included in this analysis, the authors cannot discern whether sea ice and/or glacial ice melt impact productivity through altering light and/or iron levels."
  kind: caveat
  source:
    locator: "Results and discussion, paragraph 6"
    page: 15
    quote: "Because iron concentrations were not included in this analysis, we cannot discern whether sea ice and/or glacial ice melt impact productivity through altering light and/or iron levels by increased stratification or fertilization"
  status: verified
- id: C63
  text: "Although no direct iron measurements were made in this study, iron availability being a first-order factor regulating NCP at the WAP cannot be ruled out."
  kind: caveat
  source:
    locator: "Results and discussion, paragraph 6"
    page: 15
    quote: "Although no direct iron measurements were made in this study, iron availability being a first-order factor regulating NCP at the WAP cannot be ruled out"
  status: verified
- id: C64
  text: "Two other community-assemblages, MER (module red, 27 ASVs) and MEG (module green, 29 ASVs), also contribute to NCP models but to a lesser extent."
  kind: result
  source:
