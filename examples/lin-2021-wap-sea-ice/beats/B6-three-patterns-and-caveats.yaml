- id: B6
  title: "Three patterns, and what the authors cannot say"
  act: discussion
  panels:
  - id: B6.1
    weight: wide
    frame: outlined
    transition: scene-to-scene
    word_picture: additive
    scene: "Kip the krill and Dot the diatom stand side by side; Wren holds her flask behind them."
    speech:
    - { speaker: narrator, kind: caption, text: "The authors hypothesize three broad patterns. (i) Large centric diatoms associated with ice-melt form intensive blooms and fuel a short food chain from krill to other top predators." }
    claim_ids: [C70]
    staging:
      characters:
      - { id: wren, x: 0.15, pose: point, face: neutral, facing: right, holding: flask, scale: 0.9 }
      - { id: dot, x: 0.5, pose: stand, face: neutral, facing: right, scale: 0.95 }
      - { id: kip, x: 0.78, pose: stand, face: neutral, facing: left, scale: 1.3 }
  - id: B6.2
    weight: small
    frame: borderless
    height: short
    transition: moment-to-moment
    word_picture: word-specific
    scene: "Wren, holding her flask, finishes the thought."
    speech:
    - { speaker: narrator, kind: caption, text: "On this hypothesis, high productivity combined with small losses through trophic transfer results in high export production." }
    claim_ids: [C71]
    staging:
      characters:
      - { id: wren, x: 0.5, pose: stand, face: neutral, facing: right, holding: flask }
  - id: B6.3
    weight: standard
    frame: outlined
    transition: scene-to-scene
    word_picture: parallel
    scene: "Teo, with his teacup, stands by a board titled hypothesis: warmer water."
    speech:
    - { speaker: narrator, kind: caption, text: "(ii) In warmer water, small cryptophytes dominate. Compared to large diatoms, their growth could be more efficiently checked by small microzooplankton grazers, thus resulting in lower biomass for export." }
    claim_ids: [C72]
    staging:
      characters:
      - { id: teo, x: 0.22, pose: sip, face: neutral, facing: right, holding: teacup, scale: 0.9 }
      props:
      - { kind: board, x: 0.45, y: 0.15, w: 0.52, h: 0.5, title: "hypothesis: warmer water", cards: [ { label: "small cryptophytes" } ] }
  - id: B6.4
    weight: standard
    frame: borderless
    transition: scene-to-scene
    word_picture: parallel
    scene: "Wren stands by a board titled hypothesis: deep mixing."
    speech:
    - { speaker: narrator, kind: caption, text: "(iii) With deep mixing, primary production in the water column is low due to light limitation. The last pattern displays the lowest NCP." }
    claim_ids: [C73, C74]
    staging:
      characters:
      - { id: wren, x: 0.22, pose: point, face: neutral, facing: right, holding: flask, scale: 0.9 }
      props:
      - { kind: board, x: 0.5, y: 0.15, w: 0.48, h: 0.5, title: "hypothesis: deep mixing", cards: [ { label: "light limitation" } ] }
  - id: B6.5
    weight: wide
    frame: outlined
    transition: scene-to-scene
    word_picture: additive
    scene: "Wren and Teo stand together, looking out."
    speech:
    - { speaker: narrator, kind: caption, text: "With climate change, the WAP region is projected to have a significant loss in summer sea ice, a rise in sea surface temperatures, and deeper mixing associated with more open water and stronger winds." }
    claim_ids: [C75]
    staging:
      characters:
      - { id: wren, x: 0.35, pose: stand, face: neutral, facing: right, holding: flask }
      - { id: teo, x: 0.6, pose: sip, face: neutral, facing: right, holding: teacup }
  - id: B6.6
    weight: small
    frame: outlined
    height: short
    transition: moment-to-moment
    word_picture: word-specific
    scene: "Teo, teacup in hand, raises one question."
    speech:
    - { speaker: narrator, kind: caption, text: "Consequently, the latter two scenarios may become more prevalent in the upcoming years to decades." }
    claim_ids: [C76]
    staging:
      characters:
      - { id: teo, x: 0.5, pose: think, face: neutral, facing: right, holding: teacup }
  - id: B6.7
    weight: standard
    frame: outlined
    transition: scene-to-scene
    word_picture: additive
    scene: "Teo asks about iron; Wren holds her flask and answers."
    speech:
    - { speaker: narrator, kind: caption, text: "Because iron concentrations were not included in this analysis, the authors cannot discern whether sea ice and/or glacial ice melt impact productivity through altering light and/or iron levels." }
    - { speaker: teo, text: "And iron?" }
    - { speaker: wren, text: "No direct iron measurements were made." }
    claim_ids: [C62, C63]
    staging:
      characters:
      - { id: teo, x: 0.25, pose: think, face: neutral, facing: right, holding: teacup }
      - { id: wren, x: 0.75, pose: shrug, face: neutral, facing: left, holding: flask }
  - id: B6.8
    weight: standard
    frame: borderless
    transition: scene-to-scene
    word_picture: additive
    scene: "Wren, with her flask, and Teo, with his teacup, stand side by side."
    speech:
    - { speaker: narrator, kind: caption, text: "The study represents the longest record of eukaryotic DNA-based community structure and NCP in coastal Antarctica, but its observations are limited to seasonal snapshots of the (summer) WAP system." }
    claim_ids: [C77]
    staging:
      characters:
      - { id: wren, x: 0.3, pose: stand, face: neutral, facing: right, holding: flask }
      - { id: teo, x: 0.72, pose: sip, face: neutral, facing: left, holding: teacup }
  - id: B6.9
    weight: wide
    frame: outlined
    transition: moment-to-moment
    word_picture: additive
    scene: "Wren holds her flask and Teo shrugs."
    speech:
    - { speaker: narrator, kind: caption, text: "Correlation-based analyses and statistical models will need to be further validated with field incubations and lab experiments." }
    claim_ids: [C78]
    staging:
      characters:
      - { id: wren, x: 0.3, pose: stand, face: neutral, facing: right, holding: flask }
      - { id: teo, x: 0.7, pose: shrug, face: neutral, facing: left, holding: teacup }
  - id: B6.10
    weight: wide
    frame: outlined
    transition: scene-to-scene
    word_picture: word-specific
    scene: "Wren thinks, holding her flask."
    speech:
    - { speaker: narrator, kind: caption, text: "To the extent that interannual variability in the influence of sea ice extent serves as a proxy for longer-term consequences of climate change, the WAP and other coastal Antarctica regions could be destined for reduced biodiversity and biological carbon drawdown." }
    claim_ids: [C79]
    staging:
      characters:
      - { id: wren, x: 0.5, pose: think, face: neutral, facing: right, holding: flask }
  - id: B6.11
    weight: full
    frame: borderless
    height: tall
    transition: scene-to-scene
    word_picture: word-specific
    scene: "Wren and Teo stand on the deck by a ship in a wide quiet closing panel; Teo holds his teacup."
    speech:
    - { speaker: narrator, kind: caption, text: "However, a longer time series will be needed to confirm the pattern." }
    - { speaker: teo, text: "Then I will bring more tea." }
    claim_ids: [C80]
    humour:
      note: "The tea gag from the filters panel comes back as a callback: Teo's line sits beside the authors' own caveat, which the caption states unchanged. Check: 1 no change; 2 reads as Teo's voice; 3 Teo's tea; 4 it sits beside a caveat and could read as making light of it, so a human must decide; 5 probably."
      keeps_claims_intact: false
    staging:
      characters:
      - { id: wren, x: 0.3, pose: stand, face: neutral, facing: right, holding: flask }
      - { id: teo, x: 0.45, pose: sip, face: neutral, facing: right, holding: teacup }
      props:
      - { kind: ship, x: 0.6, y: 0.5, w: 0.35, h: 0.35 }
