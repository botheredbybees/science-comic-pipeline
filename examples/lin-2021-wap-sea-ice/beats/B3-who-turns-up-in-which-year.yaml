- id: B3
  title: "Who turns up in which year"
  act: result
  panels:
  - id: B3.1
    weight: small
    frame: outlined
    transition: scene-to-scene
    word_picture: parallel
    scene: "Wren points at a schematic axis running from the shelf zone to offshore, titled with where NCP was highest."
    speech:
    - { speaker: narrator, kind: caption, text: "During the summer, NCP was highest in the shelf zone and decreased offshore." }
    claim_ids: [C30]
    staging:
      characters:
      - { id: wren, x: 0.2, pose: point, face: neutral, facing: right, holding: notebook, scale: 0.8 }
      props:
      - { kind: axis, x: 0.4, y: 0.3, w: 0.58, h: 0.5, title: "NCP decreased offshore", items: [ { label: "shelf zone", at: 0.1 }, { label: "offshore", at: 0.88 } ] }
  - id: B3.2
    weight: wide
    frame: borderless
    transition: scene-to-scene
    word_picture: additive
    scene: "A timeline of the five years: 2014 and 2016 are solid bars marked late, 2012, 2013 and 2015 are hollow bars marked early. Wren points at the solid ones."
    speech:
    - { speaker: narrator, kind: caption, text: "The two years that feature late sea-ice retreat (2014 and 2016) were associated with abnormally high summer NCP (t-test, p < 0.0001)." }
    claim_ids: [C31, C39]
    staging:
      characters:
      - { id: wren, x: 0.08, pose: point, face: neutral, facing: right, holding: notebook, scale: 0.8 }
      props:
      - { kind: axis, x: 0.2, y: 0.2, w: 0.78, h: 0.6, title: "ice retreat: late (solid) or early (hollow)", items: [ { label: "2012 early", at: 0.02, to: 0.17, style: hollow }, { label: "2013 early", at: 0.22, to: 0.37, style: hollow }, { label: "2014 late", at: 0.42, to: 0.57, style: solid }, { label: "2015 early", at: 0.62, to: 0.77, style: hollow }, { label: "2016 late", at: 0.82, to: 0.97, style: solid } ] }
  - id: B3.3
    weight: standard
    frame: outlined
    transition: moment-to-moment
    word_picture: additive
    scene: "Teo, teacup in hand, raises a question and Wren answers, holding her notebook."
    speech:
    - { speaker: narrator, kind: caption, text: "The five years studied (2012 to 2016) were a period of moderately positive sea-ice area anomalies following a more prolonged period of anomalously low sea-ice area." }
    - { speaker: teo, text: "Moderately positive?" }
    - { speaker: wren, text: "After a long run of low ice. Keep that in mind." }
    claim_ids: [C32]
    staging:
      characters:
      - { id: teo, x: 0.25, pose: think, face: neutral, facing: right, holding: teacup }
      - { id: wren, x: 0.75, pose: point, face: neutral, facing: left, holding: notebook }
  - id: B3.4
    weight: wide
    frame: outlined
    height: tall
    transition: scene-to-scene
    word_picture: parallel
    scene: "A bar chart of four plankton groups and their share of the 18S reads: diatoms, cryptophytes, dinoflagellates and haptophytes."
    speech:
    - { speaker: narrator, kind: caption, text: "Four eukaryotic plankton groups dominated the WAP surface water: diatoms (25.0%), cryptophytes (23.0%), dinoflagellates (19.6%) and haptophytes (11.3%)." }
    claim_ids: [C33, C34]
    staging:
      props:
      - { kind: bars, x: 0.05, y: 0.05, w: 0.9, h: 0.9, title: "share of the 18S reads", unit: "%", max: 45, show_max: false, bars: [ { label: "diatoms", value: 25.0 }, { label: "cryptophytes", value: 23.0 }, { label: "dinoflagellates", value: 19.6 }, { label: "haptophytes", value: 11.3 } ] }
  - id: B3.5
    weight: full
    frame: outlined
    height: tall
    transition: scene-to-scene
    word_picture: interdependent
    scene: "Two bar charts side by side on the same scale. Left: high-sea-ice years. Right: warm years with less sea ice. Each has four bars: diatoms, cryptophytes, dinoflagellates, haptophytes."
    speech:
    - { speaker: narrator, kind: caption, text: "In the high-sea-ice years (2014 and 2016) diatoms were on average 39.5 ± 3.0% of the community; in the warm years with less sea ice (2012, 2013 and 2015), 14.0 ± 1.7%." }
    - { speaker: narrator, kind: caption, text: "Cryptophytes went the other way: 15.1 ± 6.1% against 28.9 ± 8.3%." }
    claim_ids: [C35, C36]
    staging:
      props:
      - { kind: bars, x: 0.03, y: 0.04, w: 0.45, h: 0.92, title: "high sea ice: 2014, 2016", unit: "%", max: 45, show_max: false, bars: [ { label: "diatoms", value: 39.5 }, { label: "cryptophytes", value: 15.1 }, { label: "dinoflagellates", value: 20.5 }, { label: "haptophytes", value: 7.1 } ] }
      - { kind: bars, x: 0.53, y: 0.04, w: 0.45, h: 0.92, title: "warm, less sea ice: 2012, 2013, 2015", unit: "%", max: 45, show_max: false, bars: [ { label: "diatoms", value: 14.0 }, { label: "cryptophytes", value: 28.9 }, { label: "dinoflagellates", value: 19.0 }, { label: "haptophytes", value: 14.4 } ] }
  - id: B3.6
    weight: standard
    frame: borderless
    transition: scene-to-scene
    word_picture: additive
    scene: "Teo asks which of two causes matters and Wren answers."
    speech:
    - { speaker: narrator, kind: caption, text: "Canonical correspondence analysis (CCA) illustrates that either ice conditions or SST is the dominant driver on community structure at the ASV level." }
    - { speaker: teo, text: "Ice or temperature, then?" }
    - { speaker: wren, text: "The paper says either." }
    claim_ids: [C38]
    staging:
      characters:
      - { id: teo, x: 0.25, pose: think, face: neutral, facing: right, holding: teacup }
      - { id: wren, x: 0.75, pose: stand, face: neutral, facing: left, holding: notebook }
  - id: B3.7
    weight: wide
    frame: outlined
    transition: action-to-action
    word_picture: parallel
    scene: "Wren points at a board titled CCA1 with two cards: late years 2014 and 2016, and early years 2012, 2013 and 2015."
    speech:
    - { speaker: narrator, kind: caption, text: "The first axis CCA1 (17.5% of the variance) separates samples from late (2014 and 2016) and early (2012, 2013, and 2015) ice-retreat years." }
    claim_ids: [C39]
    staging:
      characters:
      - { id: wren, x: 0.12, pose: point, face: neutral, facing: right, holding: notebook, scale: 0.9 }
      props:
      - { kind: board, x: 0.3, y: 0.12, w: 0.67, h: 0.6, title: "CCA1 (17.5% of the variance)", cards: [ { label: "late: 2014, 2016" }, { label: "early: 2012, 2013, 2015" } ] }
  - id: B3.8
    weight: small
    frame: outlined
    height: short
    transition: moment-to-moment
    word_picture: word-specific
    scene: "Wren, holding her notebook, answers Teo's unspoken question."
    speech:
    - { speaker: narrator, kind: caption, text: "The most substantial abiotic factor associated with CCA1 is SST (negatively correlated)." }
    claim_ids: [C40]
    staging:
      characters:
      - { id: wren, x: 0.5, pose: stand, face: neutral, facing: right, holding: notebook }
  - id: B3.9
    weight: wide
    frame: borderless
    height: tall
    transition: scene-to-scene
    word_picture: word-specific
    scene: "Wren stands alone with her notebook in a wide quiet panel, a pause after the results."
    speech:
    - { speaker: narrator, kind: caption, text: "Overall, sea-ice conditions and associated environmental parameters, such as low SST and low salinity, are the primary drivers of community differentiation at the ASV level." }
    claim_ids: [C41]
    staging:
      characters:
      - { id: wren, x: 0.4, pose: think, face: neutral, facing: right, holding: notebook, scale: 1.1 }
