- id: B1
  title: "The fastest-changing coast"
  act: problem
  panels:
  - id: B1.1
    weight: wide
    frame: outlined
    height: standard
    scene: "Wren in a lab coat stands on the deck of a ship, holding a clipboard, and points out over the water."
    speech:
    - { speaker: narrator, kind: caption, text: "The Western Antarctic Peninsula system has exhibited some of the most significant changes in the Southern Ocean, with rising air temperature up to 7 °C since 1950." }
    - { speaker: wren, text: "Up to 7 °C, since 1950." }
    claim_ids: [C2]
    staging:
      characters:
      - { id: wren, x: 0.3, pose: point, face: neutral, facing: right, holding: clipboard, scale: 1.0 }
      props:
      - { kind: ship, x: 0.5, y: 0.5, w: 0.45, h: 0.4 }
  - id: B1.2
    weight: standard
    frame: borderless
    transition: scene-to-scene
    word_picture: additive
    scene: "Teo, in a woolly hat and holding a teacup, asks a question beside a sign that names the fastest sea ice decrease in Antarctica."
    speech:
    - { speaker: narrator, kind: caption, text: "The Western Antarctic Peninsula has seen the fastest sea ice decrease in Antarctica." }
    - { speaker: teo, text: "So what does that do to the plankton?" }
    claim_ids: [C3]
    staging:
      characters:
      - { id: teo, x: 0.3, pose: sip, face: neutral, facing: right, holding: teacup }
      props:
      - { kind: sign, x: 0.6, y: 0.2, w: 0.36, h: 0.7, label: "Fastest sea ice decrease" }
  - id: B1.3
    weight: wide
    frame: outlined
    transition: subject-to-subject
    scene: "A diatom, a krill, a penguin and a whale stand in a row, facing the reader."
    speech:
    - { speaker: narrator, kind: caption, text: "Eukaryotic plankton at the Western Antarctic Peninsula, including phytoplankton and microzooplankton, support higher trophic levels ranging from krill to penguins and whales." }
    claim_ids: [C4]
    staging:
      characters:
      - { id: dot, x: 0.12, pose: stand, face: neutral, facing: right, scale: 0.9 }
      - { id: kip, x: 0.33, pose: stand, face: neutral, facing: left, scale: 1.3 }
      - { id: extra, body: penguin, x: 0.58, pose: stand, face: neutral, facing: left, scale: 0.9 }
      - { id: extra, body: whale, x: 0.85, pose: stand, face: neutral, facing: left, scale: 0.5 }
  - id: B1.4
    weight: wide
    frame: outlined
    transition: scene-to-scene
    word_picture: parallel
    scene: "Wren holds a clipboard beside a board that shows two cards, gross primary production and community respiration, under the title NCP."
    speech:
    - { speaker: narrator, kind: caption, text: "The net community production (NCP) represents the balance between gross primary production and community respiration." }
    claim_ids: [C6]
    staging:
      characters:
      - { id: wren, x: 0.2, pose: point, face: neutral, facing: right, holding: clipboard }
      props:
      - { kind: board, x: 0.4, y: 0.12, w: 0.58, h: 0.6, title: "NCP is the balance between", cards: [ { label: "gross primary production" }, { label: "community respiration" } ] }
  - id: B1.5
    weight: standard
    frame: borderless
    transition: action-to-action
    word_picture: additive
    scene: "Teo, teacup in hand, checks his understanding with Wren, who holds her clipboard."
    speech:
    - { speaker: narrator, kind: caption, text: "When the organic carbon pool in the mixed layer is in a steady state, NCP reflects the organic carbon available for export out of the surface mixed layer." }
    - { speaker: teo, text: "So NCP tells us how much carbon is available to leave the surface?" }
    claim_ids: [C7]
    staging:
      characters:
      - { id: teo, x: 0.28, pose: sip, face: neutral, facing: right, holding: teacup }
      - { id: wren, x: 0.72, pose: stand, face: smile, facing: left, holding: clipboard }
  - id: B1.6
    weight: wide
    frame: outlined
    height: tall
    transition: scene-to-scene
    word_picture: word-specific
    scene: "Wren stands alone with her clipboard, looking out, in a wide quiet panel."
    speech:
    - { speaker: narrator, kind: caption, text: "Given the fundamental importance of eukaryotic plankton at the WAP, it is imperative to understand and predict the changes in plankton community structure, biodiversity, and carbon flux in this rapidly changing environment." }
    claim_ids: [C5]
    staging:
      characters:
      - { id: wren, x: 0.35, pose: think, face: neutral, facing: right, holding: clipboard, scale: 1.1 }
