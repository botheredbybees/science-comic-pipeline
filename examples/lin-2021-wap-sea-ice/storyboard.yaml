  text: MEG contributes to NCP negatively in GP solutions (2) and (3). It represents a group of heterotrophic protists, dominated by Picomonas and Telonema.
  kind: result
  source:
    locator: Results and discussion, paragraph 7
    page: 17
    quote: MEG contributes to NCP negatively in GP solutions (2) and (3). It represents a group of heterotrophic protists, dominated by Picomonas and Telonema
  status: verified
- id: C70
  text: 'The authors hypothesize that the summer plankton community-NCP system at the WAP mainly follows three broad patterns: (i) large centric diatoms associated with ice-melt form intensive blooms and
    fuel a short food chain from krill to other top predators.'
  kind: interpretation
  source:
    locator: Results and discussion, paragraph 8
    page: 18
    quote: 'we hypothesize that the summer plankton community—NCP system at the WAP mainly follows three broad patterns: (i) large centric diatoms associated with ice-melt form intensive blooms and fuel
      a short food chain from krill to other top predators'
  status: verified
  note: A hypothesis, not a finding.
- id: C71
  text: This high productivity combined with small losses through trophic transfer results in high export production.
  kind: interpretation
  source:
    locator: Results and discussion, paragraph 8
    page: 18
    quote: This high productivity combined with small losses through trophic transfer results in high export production
  status: verified
  note: Part of the hypothesis (i). Export was not measured.
- id: C72
  text: (ii) In warmer water, small cryptophytes dominate. Compared to large diatoms, their growth could be more efficiently checked by small microzooplankton grazers, thus resulting in lower biomass for
    export.
  kind: interpretation
  source:
    locator: Results and discussion, paragraph 8
    page: 18
    quote: (ii) In warmer water, small cryptophytes dominate. Compared to large diatoms, their growth could be more efficiently checked by small microzooplankton grazers, thus resulting in lower biomass
      for export
  status: verified
  note: Hypothesis, with 'could'.
- id: C73
  text: (iii) With deep mixing, primary production in the water column is low due to light limitation.
  kind: interpretation
  source:
    locator: Results and discussion, paragraph 8
    page: 18
    quote: (iii) With deep mixing, primary production in the water column is low due to light limitation
  status: verified
  note: Hypothesis.
- id: C74
  text: Of the three hypothesized patterns, the last displays the lowest NCP.
  kind: interpretation
  source:
    locator: Results and discussion, paragraph 8
    page: 18
    quote: The last pattern displays the lowest NCP
  status: verified
  note: Part of the hypotheses; no measured NCP value is given for it.
- id: C75
  text: With climate change, the WAP region is projected to have a significant loss in summer sea ice, a rise in sea surface temperatures, and deeper mixing associated with more open water and stronger
    winds.
  kind: background
  source:
    locator: Results and discussion, paragraph 8
    page: 18
    quote: With climate change, the WAP region is projected to have a significant loss in summer sea ice, a rise in sea surface temperatures, and deeper mixing associated with more open water and stronger
      winds
  status: verified
- id: C76
  text: Consequently, the latter two scenarios may become more prevalent in the upcoming years to decades.
  kind: interpretation
  source:
    locator: Results and discussion, paragraph 8
    page: 18
    quote: Consequently, the latter two scenarios may become more prevalent in the upcoming years to decades
  status: verified
  note: '''May''. The latter two are the warm-water cryptophyte and deep-mixing patterns.'
- id: C77
  text: The authors' study represents the longest record of eukaryotic DNA-based community structure and NCP in coastal Antarctica, but the observations are limited to seasonal snapshots of the (summer)
    WAP system.
  kind: caveat
  source:
    locator: Results and discussion, paragraph 9
    page: 19
    quote: Although our study represents the longest record of eukaryotic DNA-based community structure and NCP in coastal Antarctica, our observations are limited to seasonal snapshots of the (summer)
      WAP system
  status: verified
- id: C78
  text: Correlation-based analyses and statistical models will need to be further validated with field incubations and lab experiments.
  kind: caveat
  source:
    locator: Results and discussion, paragraph 9
    page: 19
    quote: correlation-based analyses and statistical models will need to be further validated with field incubations and lab experiments
  status: verified
- id: C79
  text: To the extent that the observed interannual variability in the influence of sea ice extent on ecosystem structure and functioning serves as a proxy for broader, longer-term ecological consequences
    associated with climate change, the WAP and other coastal Antarctica regions could be destined for reduced biodiversity and biological carbon drawdown.
  kind: interpretation
  source:
    locator: Results and discussion, paragraph 9
    page: 19
    quote: To the extent that the observed interannual variability in the influence of sea ice extent on ecosystem structure and functioning serves as a proxy for broader, longer-term ecological consequences
      associated with climate change, the WAP and other coastal Antarctica regions could be destined for reduced biodiversity and biological carbon drawdown
  status: verified
  note: Conditional ('to the extent that', 'could').
- id: C80
  text: However, a longer time series will be needed to confirm the pattern.
  kind: caveat
  source:
    locator: Results and discussion, paragraph 9
    page: 19
    quote: However, a longer time series will be needed to confirm the pattern
  status: verified
