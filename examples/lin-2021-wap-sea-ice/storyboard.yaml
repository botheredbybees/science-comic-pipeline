  text: The Western Antarctic Peninsula system has exhibited some of the most significant changes in the Southern Ocean, with rising air temperature up to 7 °C since 1950.
  kind: background
  source:
    locator: Introduction, paragraph 1
    page: 3
    quote: The Western Antarctic Peninsula (WAP) system has exhibited some of the most significant changes in the Southern Ocean,, with rising air temperature up to 7 °C since 1950
  status: verified
- id: C3
  text: The Western Antarctic Peninsula has seen the fastest sea ice decrease in Antarctica.
  kind: background
  source:
    locator: Introduction, paragraph 1
    page: 3
