    locator: Introduction, paragraph 1
    page: 3
    quote: given the fundamental importance of eukaryotic plankton at the WAP, it is imperative to understand and predict the changes in plankton community structure, biodiversity, and carbon flux in this
      rapidly changing environment
  status: verified
- id: C6
  text: The net community production (NCP) represents the balance between gross primary production and community respiration.
  kind: background
  source:
    locator: Introduction, paragraph 2
    page: 5
    quote: The net community production (NCP) represents the balance between gross primary production and community respiration
  status: verified
  note: Definition claim (paper's own gloss of NCP).
- id: C7
  text: When the organic carbon pool in the mixed layer is in a steady state, NCP equals the net carbon flux out (carbon export), so NCP reflects the organic carbon available for export out of the surface
    mixed layer depth (MLD).
  kind: background
  source:
    locator: Introduction, paragraph 2
    page: 5
    quote: When the organic carbon pool at the mixed layer is under a steady state, the net carbon flux in (i.e., NCP) equals the net carbon flux out (i.e., carbon export). Therefore, NCP reflects the amount
      of organic carbon available for export out of the surface MLD
  status: verified
  note: Only under a steady state. NCP is available for export, not measured export.
- id: C10
  text: The authors analyze five years of high-resolution NCP and high-throughput DNA sequencing data to explore the contribution of polar eukaryotic plankton to biological carbon fluxes.
  kind: method
