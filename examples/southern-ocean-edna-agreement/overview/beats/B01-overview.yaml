- id: B1
  title: Three studies, one question
  act: problem
  panels:
  - id: B1.1
    weight: small
    frame: borderless
    word_picture: duo-specific
    scene: A balance with level pans, one labelled water and one labelled sediment (top section).
    speech:
    - speaker: narrator
      kind: caption
      text: In Clarke's study, at sites where both were collected, similar numbers of taxa were detected in water eDNA samples and the top section of sediment cores (paired t-test, P = 0.67).
    claim_ids:
    - C6
    staging:
      props:
      - kind: scales
        x: 0.1
        y: 0.05
        w: 0.8
        h: 0.9
        tilt: level
        items:
        - label: water
        - label: sediment, top section
    height: short
  - id: B1.2
    weight: small
    frame: outlined
    transition: aspect-to-aspect
    word_picture: duo-specific
    scene: Two separate groups of dots, one labelled water and one labelled sediment.
    speech:
    - speaker: narrator
      kind: caption
      text: But in Clarke's study metazoan communities from water and sediment eDNA samples were significantly different (P < 0.001).
    claim_ids:
    - C9
    staging:
      props:
      - kind: clusters
        x: 0.08
        y: 0.05
        w: 0.84
        h: 0.9
        items:
        - label: water
        - label: sediment
    height: short
  - id: B1.3
    weight: small
    frame: outlined
    transition: subject-to-subject
    word_picture: interdependent
    scene: 'A stacked column: a block for the species found with both methods and a smaller block for the extra species of LargeVF.'
    speech:
    - speaker: narrator
      kind: caption
      text: 'In Nester''s survey the overlap of detected species was large: 51 species were detected with both sampling methods. However, LargeVF detected 14 additional species, primarily arthropod (8 species)
        and chordate species (4 species).'
    claim_ids:
    - C20
    staging:
      props:
      - kind: stack
        x: 0.1
        y: 0.05
        w: 0.8
        h: 0.9
        title: species detected
        items:
        - label: with both methods
          value: 51
        - label: extra with LargeVF
          value: 14
    height: short
  - id: B1.4
    weight: small
    frame: outlined
    transition: scene-to-scene
    word_picture: duo-specific
    scene: Clusters of dots, one dot out of place, and Ines beside them.
    speech:
    - speaker: narrator
      kind: caption
      text: Based on nMDS graphical analyses, samples from most MZG-ICE groups clustered by ocean region and biome. However, several samples for each gene marker did not cluster with samples from the same
        collection location.
    - speaker: ines
      text: Most. Not all.
    claim_ids:
    - C33
    - C34
    staging:
      props:
      - kind: clusters
        x: 0.02
        y: 0.04
        w: 0.62
        h: 0.8
        label: nMDS
      characters:
      - id: ines
        x: 0.82
        pose: point
        face: neutral
        facing: left
        scale: 0.8
    height: short
  - id: B1.5
    weight: small
    frame: outlined
    transition: scene-to-scene
    word_picture: parallel
    scene: Ines, close up, with a puzzled face.
    speech:
    - speaker: narrator
      kind: caption
      text: 'Clarke''s team ask: how do we know an organism detected with eDNA is really there?'
    claim_ids:
    - C12
    staging:
      shot: close
      characters:
      - id: ines
        x: 0.5
        pose: think
        face: puzzled
        facing: right
    height: short
  - id: B1.6
    weight: small
    height: short
    frame: outlined
    transition: scene-to-scene
    word_picture: additive
    scene: Ines points at a book labelled 'the full comic'.
    speech:
    - speaker: ines
      text: The full comic is linked below.
    claim_ids: []
    staging:
      props:
      - kind: book
        x: 0.5
        y: 0.3
        w: 0.42
        h: 0.6
        label: the full comic
      characters:
      - id: ines
        x: 0.2
        pose: point
        face: smile
        facing: right
        scale: 0.8
