  spine:
    and: 'DNA left in seawater and sediment is now used to list what lives there, and using it for monitoring will need documented evidence of accuracy, reliability and reproducibility (Blanco-Bercial:
      C26; Clarke: C1, C2; Nester: C14, C15).'
    but: 'Nobody can take agreement for granted: two earlier studies found less than 10% overlap between sediment and benthic water samples (Clarke: C1), and the three studies here each change one thing
      and ask whether the answer holds. Water and sediment gave similar numbers of taxa but different communities (Clarke: C6, C9); two filter set-ups shared 51 species yet one gave higher mean richness
      (Nester: C19, C20); ten laboratories clustered samples by ocean region once contaminated samples were removed, but several samples did not cluster and the species level agreed least (Blanco-Bercial:
      C33, C34, C35, C37).'
    therefore: 'Where the three papers differ the comic puts them side by side and does not choose (Clarke: C6, C9; Nester: C19, C20). The authors themselves say what is still open: how to know an organism
      detected with eDNA is really there (Clarke: C12), pairing eDNA with other methods (Clarke: C13; Nester: C24), further testing of filter volumes and pore sizes (Nester: C25), the effect of each protocol
      step (Blanco-Bercial: C39) and species-level results (Blanco-Bercial: C40).'
