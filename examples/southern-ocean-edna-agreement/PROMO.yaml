    claims: [C2, C6, C9, C16, C19, C20, C22, C23, C26, C27, C33, C34, C37, C12]
    text: |-
      Using environmental DNA to list what lives in the ocean will need documented evidence of accuracy, reliability and reproducibility. A comic about three studies that each changed one thing.

      Water or mud, Vestfold Hills, East Antarctica: similar numbers of taxa, but significantly different communities.

      Two filters, Hobart to Davis Station: 51 species in common, yet the large-volume filter gave higher mean species richness and 14 additional species. The authors recognise that the difference between their pore sizes is large and that different volumes introduce bias, and that findings from open ocean may not apply to coastal environments.

      Ten laboratories, shared aliquots of zooplankton DNA: most groups clustered samples by ocean region, several samples did not, and for COI similarity fell from orders to genera to species.

      Still open, in the authors' words: how do we know an organism detected with eDNA is really there?
