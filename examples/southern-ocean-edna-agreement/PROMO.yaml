abstract:
  approved: false
  claims: [C6, C9, C12, C16, C19, C20, C26, C27, C33, C34, C37]
  text: >-
    Using environmental DNA to list what lives in the ocean will need documented evidence of accuracy, reliability
    and reproducibility. Three studies each changed one thing and asked whether the answer held. In Antarctic
    nearshore samples, water and sediment eDNA detected similar numbers of taxa but significantly different
    communities. On a transect from Hobart to Davis Station, two filter set-ups shared 51 species, yet the
    large-volume filter gave higher mean species richness and 14 additional species. Ten laboratories analysed
    shared aliquots of DNA from zooplankton samples with their own protocols: most groups clustered samples by ocean region, several
    samples did not cluster with their collection location, and for COI the similarity among groups fell from orders
    to genera to species. The authors also ask the question that is still open: how do we know an organism detected
    with eDNA is really there?
