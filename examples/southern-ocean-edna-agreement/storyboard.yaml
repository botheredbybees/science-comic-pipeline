  - id: B3.8
    weight: wide
    frame: outlined
    transition: subject-to-subject
    word_picture: additive
    scene: 'A box labelled this study: open ocean, an arrow, and a box saying it may not apply to coastal environments.'
    speech:
    - speaker: narrator
      kind: caption
      text: Nester's team recognise that the difference between their pore sizes is large, and that the use of different volumes introduces bias.
    - speaker: narrator
      kind: caption
      text: Nester's study was in the open ocean, with relatively low numbers of Animalia taxa, so the findings may not apply to coastal environments with greater diversity and richness of Animalia species.
