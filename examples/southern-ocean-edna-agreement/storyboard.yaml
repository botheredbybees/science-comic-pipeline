    word_picture: duo-specific
    scene: A bar chart of mean species richness, LargeVF against SmallVF.
    speech:
    - speaker: narrator
      kind: caption
      text: In Nester's survey mean species richness was significantly higher in the LargeVF samples (10.03 ± 0.44) than in SmallVF samples (8.4 ± 0.44; p < 0.001) across the entire transect.
    claim_ids:
    - C19
    staging:
      props:
      - kind: bars
