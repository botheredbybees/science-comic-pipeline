  - id: B3.6
    weight: standard
    frame: outlined
    transition: scene-to-scene
    word_picture: picture-specific
    device: moment
    scene: A continuous plankton recorder fills the panel.
    speech:
    - speaker: narrator
      kind: caption
      text: 'Nester''s team describe the continuous plankton recorder (CPR): it is towed behind a ship at approximately 10 m depth, collecting plankton samples onto a continuously winding silk.'
    claim_ids:
    - C15
    staging:
      props:
      - kind: cpr
        x: 0.05
        y: 0.05
        w: 0.9
        h: 0.9
