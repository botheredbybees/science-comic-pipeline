  - id: B3.7
    weight: wide
    frame: outlined
    transition: subject-to-subject
    word_picture: interdependent
    scene: 'Two overlapping circles: eDNA and CPR, with the shared species in the overlap.'
    speech:
    - speaker: narrator
      kind: caption
      text: Merged eDNA samples detected more species (37) than the CPR (18), with only 12 species shared between the methodologies, Nester's team report.
    claim_ids:
    - C21
    staging:
      props:
      - kind: venn
        x: 0.1
        y: 0.05
        w: 0.8
        h: 0.9
