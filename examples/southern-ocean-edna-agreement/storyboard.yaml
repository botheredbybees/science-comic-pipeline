version: 2
meta:
  title: Does eDNA Agree With Itself? Water or Mud, Two Filters, Ten Labs
  audience: Marine-science students and curious non-specialists who have heard that DNA left in seawater can tell us which animals are there, and who want to know how far that answer can be trusted.
  left_out:
  - The three studies differ in design, size and place, and the comic does not rank them or add their results together. Clarke et al. compared water with sediment at nearshore sites near Davis station.
    Nester et al. compared two filter set-ups, and eDNA with the continuous plankton recorder, along one open-ocean voyage. Blanco-Bercial et al. compared ten laboratories analysing shared DNA from zooplankton
    samples.
  - Blanco-Bercial et al. is about zooplankton from ten places across the global ocean (the Baltic Sea, the Tasman Sea and others), not only the Southern Ocean, and the comic makes no claim about the Southern
    Ocean from it. Its samples were not collected by the other two teams and its design is not theirs.
  - 'None of the studies tested whether eDNA matches what is really living at a site: Clarke et al. say this is not examined, and Nester et al. and Blanco-Bercial et al. compare eDNA with eDNA (or with
    the plankton recorder), not with a complete census. ''Agrees with itself'' is the comic''s question, not a result any paper reports.'
  - Laboratory and bioinformatics detail in all three (extraction, PCR cycling, sequencers, read processing, reference databases) and most statistics (PERMANOVA, nMDS, Mantel tests, Hill numbers, Shannon
    index, F, t and R2 values; a few P values are kept).
  - 'Everything that only a figure, a supplementary table or the full species lists show: no number was read off a figure. The names of individual species, and Nester et al.''s hull-fouling and biosecurity
    results, are left out because they are about something other than agreement.'
  - 'Terms the papers do not gloss and the comic keeps as written: benthic, metazoan (glossed once as multicellular), Animalia, species richness, taxa, OTU, ocean region and biome, amplification, nMDS clustering.'
  - 'Other results that bear on agreement and are not drawn: the Davis sediment core sections, the effect of sequencing depth, Nester et al.''s transect zones, Blanco-Bercial et al.''s diversity indices,
    the NextSeq platform, and the markers'' Mantel correlations.'
