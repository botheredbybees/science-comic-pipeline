        y: 0.76
        x2: 0.78
        y2: 0.76
  - id: B3.2
    weight: wide
    frame: outlined
    transition: subject-to-subject
    word_picture: duo-specific
    scene: 'A split screen: a filter set-up labelled LargeVF on the left, a filter set-up labelled SmallVF on the right.'
    speech:
    - speaker: narrator
      kind: caption
      text: 'Nester''s team tested two combinations of water volume and filter pore size at each sampling location: 12 l with 20 μm (LargeVF), and 2 l with 0.45 μm (SmallVF).'
    claim_ids:
    - C17
    staging:
      split_direction: side
      split_labels:
