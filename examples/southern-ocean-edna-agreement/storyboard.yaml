        - kind: filter
          x: 0.05
          y: 0.1
          w: 0.9
          h: 0.8
          label: 2 l, 0.45 μm
  - id: B3.3
    weight: standard
    frame: outlined
    transition: subject-to-subject
    word_picture: duo-specific
    scene: A bar chart of the share of reads assigned to Animalia taxa, SmallVF against LargeVF, and Ines beside it.
    speech:
    - speaker: narrator
      kind: caption
      text: Over Nester's whole survey, just 11.37% of reads within the SmallVF samples were assigned to Animalia taxa, compared to 85.66% of reads within the LargeVF samples.
    - speaker: ines
      text: Very different shares.
    claim_ids:
    - C18
