- id: B3
  title: "The nitrogen test"
  act: method
  panels:
  - id: B3.1
    weight: wide
    frame: outlined
    transition: scene-to-scene
    word_picture: additive
    scene: "Three boxes joined by arrows: nitrogen fixation, biomedical trajectory, phosphorus and iron."
    speech:
    - {speaker: narrator, kind: caption, text: "To test the exchange, the authors use three approaches: nitrogen fixation as an example, the recent trajectory of biomedical research, and the ocean phosphorus and iron cycles."}
    claim_ids: [C13]
    staging:
      props:
      - {kind: flow, x: 0.04, y: 0.15, w: 0.92, h: 0.7, items: [{label: "nitrogen fixation"}, {label: "biomedical trajectory"}, {label: "phosphorus and iron"}]}
  - id: B3.2
    weight: standard
    frame: borderless
    transition: subject-to-subject
    scene: "The physiologist, proud, holds a mug beside a small sign that says 'rates in, fluxes out'."
    speech:
    - {speaker: narrator, kind: caption, text: "Physiological studies played an early role by quantifying rates of diazotrophy (nitrogen fixation). Those rates were needed to estimate global biogeochemical fluxes of N."}
    - {speaker: physio, text: "Rates in, fluxes out."}
    claim_ids: [C64, C14, C15]
    staging:
      characters:
      - {id: physio, x: 0.35, pose: hold, face: smile, facing: right, holding: mug, scale: 0.9}
      props:
      - {kind: sign, x: 0.58, y: 0.1, w: 0.36, h: 0.6, label: "rates in, fluxes out"}
  - id: B3.3
    weight: wide
    frame: outlined
    transition: action-to-action
    scene: "The omics researcher points at a board with two cards: Crocosphaera and UCYN-A."
    speech:
    - {speaker: narrator, kind: caption, text: "Imbalances in the N fluxes uncovered unidentified N sources, and genetic tools then identified more diazotrophs. Omics has revealed diverse N2 fixers, including the cyanobacteria Crocosphaera and UCYN-A."}
    - {speaker: omicist, text: "More fixers."}
    claim_ids: [C16, C17]
    staging:
      characters:
      - {id: omicist, x: 0.2, pose: point, face: smile, facing: right, scale: 0.9}
      props:
      - {kind: board, x: 0.42, y: 0.15, w: 0.52, h: 0.55, title: "N fixers", cards: [{label: "Crocosphaera"}, {label: "UCYN-A"}]}
  - id: B3.4
    weight: wide
    frame: outlined
    transition: scene-to-scene
    word_picture: word-specific
    scene: "A box labelled 'nif gene abundance', a crossed-out equals sign, and a box labelled 'N2 fixation rate'. The modeller looks at them."
    speech:
    - {speaker: narrator, kind: caption, text: "But nitrogenase (nif) gene abundance does not directly equate to N2 fixation rates."}
    - {speaker: modeller, text: "Genes aren't rates."}
    claim_ids: [C18]
    staging:
      characters:
      - {id: modeller, x: 0.5, pose: point, face: deadpan, facing: left, scale: 0.65}
      props:
      - {kind: box, x: 0.03, y: 0.03, w: 0.3, h: 0.3, label: "nif gene abundance"}
      - {kind: label, x: 0.5, y: 0.14, label: "is not", size: small}
      - {kind: box, x: 0.67, y: 0.03, w: 0.3, h: 0.3, label: "N2 fixation rate"}
  - id: B3.5
    weight: standard
    frame: borderless
    transition: action-to-action
    scene: "The omics researcher holds a sheet and looks hopeful, while the physiologist watches."
    speech:
    - {speaker: narrator, kind: caption, text: "Measurements of nif expression are not well correlated with 15N-based rates of N2 fixation."}
    - {speaker: omicist, text: "What about expression?"}
    claim_ids: [C19]
    staging:
      characters:
      - {id: omicist, x: 0.3, pose: hold, face: neutral, facing: right, holding: paper, scale: 0.9}
      - {id: physio, x: 0.75, pose: shrug, face: deadpan, facing: left, scale: 0.9}
  - id: B3.6
    weight: wide
    frame: outlined
    transition: scene-to-scene
    word_picture: additive
    scene: "A box labelled CMIP6 models beside a second box saying nitrogen fixation is not included."
    speech:
    - {speaker: narrator, kind: caption, text: "N2 fixation is not included in the CMIP6 models, which currently project declining productivity in low latitude oceans in coming decades."}
    claim_ids: [C21]
    staging:
      props:
      - {kind: box, x: 0.1, y: 0.2, w: 0.35, h: 0.45, label: "CMIP6 models"}
      - {kind: box, x: 0.58, y: 0.2, w: 0.3, h: 0.45, label: "N2 fixation: not included"}
  - id: B3.7
    weight: standard
    frame: borderless
    transition: moment-to-moment
    scene: "The modeller, physiologist and omics researcher stand together."
    speech:
    - {speaker: narrator, kind: caption, text: "Both rates and omics will be needed increasingly, say the authors, to reveal and quantify unknown but biogeochemically important pathways for the turnover of N."}
    claim_ids: [C22]
    staging:
      characters:
      - {id: physio, x: 0.2, pose: stand, face: neutral, facing: right, scale: 1.4}
      - {id: modeller, x: 0.5, pose: stand, face: neutral, facing: left, scale: 1.4}
      - {id: omicist, x: 0.8, pose: stand, face: neutral, facing: left, scale: 1.4}
