- id: B2
  title: "Enter omics"
  act: problem
  panels:
  - id: B2.1
    weight: standard
    frame: outlined
    transition: scene-to-scene
    scene: "The omics researcher walks up to the desk, carrying a large stack of printouts."
    speech:
    - {speaker: narrator, kind: caption, text: "Omics studies the genome, transcriptome, proteome and metabolome, with most research on the first three. The authors say these techniques have evolved rapidly this century."}
    - {speaker: omicist, text: "Hello. I've brought data."}
    claim_ids: [C62, C6]
    staging:
      characters:
      - {id: omicist, x: 0.3, pose: hold, face: smile, facing: right, holding: paper, scale: 0.9}
      - {id: modeller, x: 0.8, pose: stand, face: neutral, facing: left, scale: 0.85}
      props:
      - {kind: desk, x: 0.55, y: 0.82, w: 0.45, h: 0.18}
  - id: B2.2
    weight: wide
    frame: outlined
    transition: action-to-action
    height: tall
    word_picture: additive
    scene: "The omics researcher drops an enormous pile of paper on the desk. The modeller peers over it."
    speech:
    - {speaker: narrator, kind: caption, text: "Omics provides a surfeit of data, at a level of detail that is often difficult to relate to the information from physiological rate measurements."}
    - {speaker: modeller, text: "That is a lot of data."}
    claim_ids: [C8]
    humour:
      note: "Two piles of paper on the desk, the second labelled 'more': the comic's own picture of 'a surfeit of data'. (1) No number, hedge or direction changes; the caption keeps the authors' wording that the detail is often difficult to relate to rate measurements. (2) The piles are plainly a drawing; the paper does not describe printouts. (3) The butt is the quantity of data, not omics researchers. (4) It does not play down a limitation; it illustrates one. (5) Honest to the authors, who wrote 'surfeit'."
      keeps_claims_intact: true
    staging:
      characters:
      - {id: omicist, x: 0.15, pose: shrug, face: smile, facing: right, scale: 0.85}
      - {id: modeller, x: 0.85, pose: stand, face: surprised, facing: left, scale: 0.85}
      props:
      - {kind: paper, x: 0.38, y: 0.3, w: 0.12, h: 0.5, label: "data"}
      - {kind: paper, x: 0.5, y: 0.2, w: 0.12, h: 0.6, label: "more"}
      - {kind: desk, x: 0.3, y: 0.82, w: 0.5, h: 0.18}
  - id: B2.3
    weight: standard
    frame: borderless
    transition: subject-to-subject
    scene: "The physiologist, mug in hand, raises an eyebrow."
    speech:
    - {speaker: narrator, kind: caption, text: "Some people implicitly assume that measuring physiological rates directly is obsolete, because rates can be inferred from omics."}
    - {speaker: physio, text: "Obsolete?"}
    claim_ids: [C7]
    staging:
      characters:
      - {id: physio, x: 0.5, pose: shrug, face: deadpan, facing: right, holding: mug, scale: 0.9}
  - id: B2.4
    weight: small
    frame: outlined
    transition: moment-to-moment
    scene: "A quiet shot of a lab jar sitting on the desk."
    speech:
    - {speaker: narrator, kind: caption, text: "The authors say physiological research has stagnated, in part driven by the advent and rapid evolution of molecular biological techniques."}
    claim_ids: [C11]
    staging:
      props:
      - {kind: jar, x: 0.35, y: 0.3, w: 0.3, h: 0.55}
      - {kind: desk, x: 0.0, y: 0.85, w: 1.0, h: 0.15}
  - id: B2.5
    weight: wide
    frame: borderless
    transition: scene-to-scene
    height: tall
    word_picture: interdependent
    scene: "Two boxes, one labelled 'omics' and one 'rates and fluxes', with the modeller standing between them, shrugging."
    speech:
    - {speaker: narrator, kind: caption, text: "The authors call the growing mismatch between the currencies of global-scale models (rates and fluxes) and the aspirations of omics something that must be addressed urgently."}
    - {speaker: modeller, text: "Different currencies."}
    claim_ids: [C9]
    staging:
      characters:
      - {id: modeller, x: 0.5, pose: shrug, face: deadpan, facing: left, scale: 0.85}
      props:
      - {kind: box, x: 0.04, y: 0.35, w: 0.28, h: 0.35, label: "omics"}
      - {kind: box, x: 0.68, y: 0.35, w: 0.28, h: 0.35, label: "rates and fluxes"}
