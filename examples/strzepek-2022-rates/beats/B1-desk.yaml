- id: B1
  title: "The desk only takes one currency"
  act: problem
  panels:
  - id: B1.1
    weight: wide
    frame: outlined
    height: standard
    word_picture: additive
    scene: "A currency-exchange desk with a sign reading 'Models: rates and fluxes'. The modeller stands behind it, ready for business."
    speech:
    - {speaker: narrator, kind: caption, text: "Earth system models, such as those within the Coupled Model Intercomparison Project (CMIP), work in currencies that include physiological rates and the biogeochemical fluxes of bioactive elements."}
    - {speaker: modeller, text: "Rates and fluxes. Those are our main coins."}
    claim_ids: [C1, C2, C65]
    staging:
      characters:
      - {id: modeller, x: 0.72, pose: point, face: smile, facing: left, scale: 0.9}
      props:
      - {kind: sign, x: 0.04, y: 0.08, w: 0.5, h: 0.6, label: "MODELS: RATES AND FLUXES"}
      - {kind: desk, x: 0.0, y: 0.8, w: 1.0, h: 0.2}
  - id: B1.2
    weight: standard
    frame: borderless
    transition: subject-to-subject
    word_picture: parallel
    scene: "The physiologist holds up a mug, looking content and unhurried."
    speech:
    - {speaker: narrator, kind: caption, text: "The physiological metrics behind those rates, such as primary productivity, have not fundamentally changed in decades."}
    - {speaker: physio, text: "Still here."}
    claim_ids: [C5]
    humour:
      note: "Deadpan: the physiologist says 'Still here.' beside the caption that the rate metrics have not fundamentally changed in decades. (1) No number, hedge, scope or direction changes; the caption is the claim, the line is a pose. (2) A reader could take 'Still here' as the authors' own words, so it is a character's line in speech, not in the caption. (3) The butt is the metric's age, not the authors, and the physiologist is smiling. (4) It does not play down a caveat. (5) Unsure whether the authors, several of them physiologists, would read it as light teasing of their field, so a human decides."
      keeps_claims_intact: false
    staging:
      characters:
      - {id: physio, x: 0.5, pose: hold, face: deadpan, facing: right, holding: mug, scale: 0.9}
  - id: B1.3
    weight: standard
    frame: outlined
    transition: moment-to-moment
    scene: "The modeller stands thoughtfully, not looking worried."
    speech:
    - {speaker: narrator, kind: caption, text: "The authors think these currencies are unlikely to change in the coming decade, for example when CMIP7 is developed."}
    claim_ids: [C3]
    staging:
      characters:
      - {id: modeller, x: 0.5, pose: think, face: neutral, facing: right, scale: 1.5}
  - id: B1.4
    weight: wide
    frame: borderless
    transition: aspect-to-aspect
    height: tall
    word_picture: duo-specific
    scene: "The modeller thinks beside a sign that shows a single question mark."
    speech:
    - {speaker: narrator, kind: caption, text: "Model projections are hindered in part by our inability to untangle how marine life responds to complex ocean change."}
    - {speaker: modeller, kind: think, text: "How does marine life respond?"}
    claim_ids: [C4]
    staging:
      characters:
      - {id: modeller, x: 0.2, pose: think, face: neutral, facing: right, scale: 0.85}
      props:
      - {kind: sign, x: 0.55, y: 0.12, w: 0.36, h: 0.55, label: "?"}
