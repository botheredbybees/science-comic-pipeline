claims:
- id: C1
  text: "The main modeling currencies are biological rates and biogeochemical fluxes."
  kind: background
  source: {locator: "Abstract", page: 1, quote: "the main modeling currencies are biological rates and biogeochemical fluxes"}
  status: verified
- id: C2
  text: "The currencies of the Earth system models in CMIP include physiological rates and the biogeochemical fluxes of bioactive elements."
  kind: background
  source: {locator: "Introduction, paragraph 1", page: 2, quote: "The CMIP currencies include the critically important rates at which metabolism occurs in living organisms (i.e. physiological rates) and the biogeochemical fluxes of bioactive elements."}
  status: verified
- id: C3
  text: "The authors think it is unlikely that these currencies will change in the coming decade, for example when CMIP7 is developed."
  kind: interpretation
  source: {locator: "Introduction, paragraph 1", page: 2, quote: "It is unlikely that these currencies will change in the coming decade, for example when CMIP7 is developed."}
  status: verified
- id: C4
  text: "Model projections are hindered in part by our inability to untangle how marine life responds to complex ocean change."
  kind: background
  source: {locator: "Introduction, paragraph 1", page: 2, quote: "our inability to untangle how marine life responds to complex ocean change"}
  status: verified
  note: "One of two issues the authors name; the other is computational limits on parameterisations."
- id: C5
  text: "The physiological metrics that are the cornerstones of Earth system models, such as primary productivity, have not fundamentally changed in decades."
  kind: background
  source: {locator: "Introduction, paragraph 2", page: 3, quote: "The physiological metrics used to quantify biological rates that are the cornerstones of Earth system models, such as primary productivity, have not fundamentally changed in decades."}
  status: verified
- id: C6
  text: "Omics techniques have evolved rapidly this century and have the potential to supersede physiological metrics."
  kind: background
  source: {locator: "Introduction, paragraph 2", page: 3, quote: "omics techniques have evolved rapidly this century and have the potential to supersede physiological metrics"}
  status: verified
- id: C7
  text: "Some people implicitly assume that measuring physiological rates directly is obsolete, because rates can be inferred from omics."
  kind: background
  source: {locator: "Introduction, paragraph 2", page: 3, quote: "an implicit assumption by some that measuring physiological rates directly is obsolete, as they can be inferred from omics"}
  status: verified
  note: "'By some', the authors' words; do not make it everyone's view."
- id: C8
  text: "Omics provides a surfeit of data, at a level of detail that is often difficult to relate to the information from physiological rate measurements."
  kind: interpretation
  source: {locator: "Introduction, paragraph 2", page: 3, quote: "omics provides a surfeit of data, at a level of detail that is often difficult to relate to the information provided by physiological rate measurements"}
  status: verified
- id: C9
  text: "The authors call the growing mismatch between the currencies of global-scale models (rates and fluxes) and the aspirations of omics something that must be addressed urgently."
  kind: interpretation
  source: {locator: "Introduction, paragraph 2", page: 3, quote: "This growing mismatch between the currencies of global-scale models (rates and fluxes) and the aspirations of omics (coupling cellular potential via omics to Earth system model projections) must be addressed urgently."}
  status: verified
- id: C10
  text: "The authors conclude that it is unlikely that omics can provide physiological rates in the coming decade."
  kind: interpretation
  source: {locator: "Abstract", page: 1, quote: "we conclude that it is unlikely that omics can provide such rates in the coming decade."}
  status: verified
  note: "A conclusion from biomedical trajectory plus case studies, not a measurement. 'Unlikely', not 'impossible'."
- id: C11
  text: "The authors say physiological research has stagnated, in part driven by the advent and rapid evolution of molecular biological techniques."
  kind: interpretation
  source: {locator: "Abstract", page: 1, quote: "physiological research has stagnated, in part driven by the advent and rapid evolution of molecular biological techniques"}
  status: verified
  note: "The authors' view; 'in part'."
- id: C12
  text: "The authors advocate the co-design of a new generation of rate measurements that better link the benefits of omics and physiology."
  kind: interpretation
  source: {locator: "Abstract", page: 1, quote: "We advocate for the co-design of a new generation of rate measurements that better link the benefits of omics and physiology."}
  status: verified
- id: C13
  text: "The authors use three approaches: ocean N2 fixation as an example, the recent trajectory of biomedical research, and the ocean phosphorus and iron cycles."
  kind: method
  source: {locator: "Introduction, paragraph 3", page: 4, quote: "We employ three approaches to address this question. First, we use ocean N2 fixation as an illustrative example of research that has evolved through joint advances in physiology and omics (Fig. 1). Second, we examine the recent trajectory of biomedical research to forecast how ocean sciences might evolve in the next decade. Third, we broaden our view by examining insights that can be gained for understanding the ocean phosphorus (P) and iron (Fe) cycles"}
  status: verified
- id: C14
  text: "Physiological studies played an important early role by quantifying rates of diazotrophy (nitrogen fixation)."
  kind: background
  source: {locator: "Lessons from marine diazotrophy, paragraph 2", page: 7, quote: "Physiological studies played an important early role by quantifying rates of diazotrophy"}
  status: verified
- id: C15
  text: "Those rate measurements provided the integrated rates needed to estimate global biogeochemical fluxes of N."
  kind: background
  source: {locator: "Lessons from marine diazotrophy, paragraph 2", page: 7, quote: "These measurements provided the integrated rates necessary to estimate global biogeochemical fluxes of N"}
  status: verified
- id: C16
  text: "Imbalances in the N fluxes uncovered unidentified N sources, and genetic tools then identified additional diazotrophic taxa that contribute to ocean N2 fixation."
  kind: background
  source: {locator: "Lessons from marine diazotrophy, paragraph 2", page: 7, quote: "imbalances in these N fluxes have uncovered unidentified N sources, and the subsequent application of genetic tools has identified additional diazotrophic taxa that contribute to ocean N2 fixation"}
  status: verified
- id: C17
  text: "Omics has revealed diverse N2 fixers, including the unicellular cyanobacteria Crocosphaera and UCYN-A."
  kind: background
  source: {locator: "Lessons from marine diazotrophy, paragraph 3", page: 8, quote: "Omics has revealed diverse N2 fixers including the unicellular cyanobacteria Crocosphaera and UCYN-A"}
  status: verified
- id: C18
  text: "Nitrogenase (nif) gene abundance does not directly equate to N2 fixation rates."
  kind: result
  source: {locator: "Lessons from marine diazotrophy, paragraph 3", page: 8, quote: "But, nif gene abundance does not directly equate to either diazotroph abundance- and biomass-based biogeographic “currencies” () or to N2 fixation rates"}
  status: verified
- id: C19
  text: "Measurements of nif expression are not well correlated with 15N-based rates of N2 fixation."
  kind: result
  source: {locator: "Lessons from marine diazotrophy, paragraph 3", page: 8, quote: "measurements of nif expression are not well correlated with 15N-based rates of N2 fixation"}
  status: verified
- id: C20
  text: "Critical gaps remain in our understanding of marine N2 fixers, and accurate global estimates of N2 fixation remain elusive."
  kind: interpretation
  source: {locator: "Lessons from marine diazotrophy, paragraph 4", page: 9, quote: "critical gaps remain in our understanding of the phylogenies, distribution and physiology of marine N2 fixers, and accurate global estimates of N2 fixation remain elusive"}
  status: verified
- id: C21
  text: "N2 fixation is not included in the CMIP6 models, which currently project declining productivity in low latitude oceans in coming decades."
  kind: background
  source: {locator: "Lessons from marine diazotrophy, paragraph 4", page: 9, quote: "Yet, N2 fixation is not included in the CMIP6 models, which currently project declining productivity in low latitude oceans in coming decades"}
  status: verified
- id: C22
  text: "Both rates and omics will be needed increasingly to reveal and quantify currently unknown but biogeochemically important pathways for the turnover of N."
  kind: interpretation
  source: {locator: "Lessons from marine diazotrophy, paragraph 4", page: 9, quote: "both rates and omics will be needed increasingly to reveal and quantify currently unknown (but biogeochemically important) pathways for the turnover of N"}
  status: verified
- id: C23
  text: "The history of N2 fixation research clearly demonstrates the rapid progress that can be made by bringing together omics and physiology."
  kind: interpretation
  source: {locator: "Lessons from marine diazotrophy, paragraph 6", page: 11, quote: "The history of N2 fixation research clearly demonstrates the rapid progress that can be made by bringing together omics and physiology."}
  status: verified
- id: C24
  text: "Genomics is the most distal to physiological activity: it demonstrates the breadth of possible gene functions but only catalogues the functional potential of an organism."
  kind: background
  source: {locator: "The status of omics, paragraph 1", page: 13, quote: "Genomics is the most distal to physiological activity. It demonstrates the breadth of possible gene functions but only catalogues the functional potential of an organism"}
  status: verified
- id: C25
  text: "A critique the authors cite says mRNA abundance is a poor proxy for protein abundance, and that fitness is primarily determined by proteins."
  kind: background
  source: {locator: "The status of omics, paragraph 1", page: 13, quote: "(iii) fitness is primarily determined by proteins, and mRNA abundance is a poor proxy for protein abundance"}
  status: verified
  note: "A critique by other authors that Strzepek et al. cite, not their own result."
- id: C26
  text: "Proteomics provides taxonomically specific information on metabolic enzymes and is therefore more proximal to physiological activity."
  kind: background
  source: {locator: "The status of omics, paragraph 1", page: 13, quote: "Proteomics, on the other hand, provides taxonomically specific information on metabolic enzymes and is therefore more proximal to physiological activity."}
  status: verified
  note: "'More proximal' is relative to the other omics layers (the preceding sentences call genomics 'the most distal'); do not draw it as proteomics giving rates."
- id: C27
  text: "It is well recognized in marine science that the amplitude and timing of the mRNA pool does not align with protein expression."
  kind: background
  source: {locator: "The status of omics, paragraph 2", page: 15, quote: "it is well recognized that the amplitude and timing of the mRNA pool does not align with protein expression."}
  status: verified
- id: C28
  text: "Diel changes in the transcriptome and proteome within a single cyanobacteria species illustrated this misalignment."
  kind: background
  source: {locator: "The status of omics, paragraph 2", page: 15, quote: "This misalignment was illustrated in while tracking diel changes in the transcriptome and proteome within a single cyanobacteria species (Fig. 2)."}
  status: verified
  note: "The species is Prochlorococcus per the Fig. 2 caption (page 12), a cited earlier study."
- id: C29
  text: "Research on the diatom Phaeodactylum tricornutum used multiple omics layers to explore regulation of N limitation and again reported mismatches between transcript, protein and metabolite abundance."
  kind: background
  source: {locator: "The status of omics, paragraph 2", page: 15, quote: "Subsequent research on the diatom Phaeodactylum tricornutum used multiple omics layers to explore the regulation of N limitation and again reported mismatches between transcript, protein and metabolite abundance"}
  status: verified
- id: C30
  text: "Even in advanced biomedical research, post-transcriptional and post-translational modifications to enzymes are confounding issues in deriving metabolic rates from omics."
  kind: interpretation
  source: {locator: "The status of omics, paragraph 2", page: 15, quote: "Hence, even in advanced biomedical research, there are confounding issues, driven by post-transcriptional and post-translational modifications to enzymes, in deriving metabolic rates from omics."}
  status: verified
- id: C31
  text: "Omics-based approaches provide static snap-shots of physiological potential."
  kind: interpretation
  source: {locator: "The status of omics, paragraph 3", page: 16, quote: "omics-based approaches provide static “snap-shots” of physiological potential"}
  status: verified
- id: C32
  text: "It is physiological activity, modified by species differences, environmental drivers and the interactions between the two, that ultimately drives biogeochemical cycles."
  kind: interpretation
  source: {locator: "The status of omics, paragraph 3", page: 16, quote: "it is physiological activity—as modified by biological species differences, environmental drivers and the interactions between the two—that ultimately drives biogeochemical cycles."}
  status: verified
- id: C33
  text: "The authors propose that physiological rates can bridge biogeochemistry and omics."
  kind: interpretation
  source: {locator: "Linking physiology and omics, paragraph 1", page: 18, quote: "We propose that physiological rates can bridge biogeochemistry and omics."}
  status: verified
- id: C34
  text: "Physiological rates quantify the integrated activity of proteins that drive marine biogeochemical cycles, in units that modelers can use."
  kind: interpretation
  source: {locator: "Linking physiology and omics, paragraph 1", page: 18, quote: "Physiological rates quantify the integrated activity of proteins that drive marine biogeochemical cycles in units that modelers can use"}
  status: verified
- id: C35
  text: "A lab study used proteomics and physiological metrics to explore the cumulative effect of five climate-change stressors on a subpolar diatom."
  kind: method
  source: {locator: "Linking physiology and omics, paragraph 2", page: 19, quote: "a lab study used proteomics and physiological metrics to explore the cumulative effect of five climate-change stressors on a subpolar diatom"}
  status: verified
  note: "Body text says 'subpolar'; Fig. 3 caption (page 14) says 'subantarctic'. Say 'a diatom' in panels."
- id: C36
  text: "In that study the effect of decreased nutrient supply in a future ocean was offset by warming."
  kind: result
  source: {locator: "Linking physiology and omics, paragraph 2", page: 19, quote: "A central finding was that the effect of decreased nutrient supply in a future ocean was offset by warming."}
  status: verified
- id: C37
  text: "Proteomics revealed that a decreased need for P was driven by lower expression of P-containing proteins associated with translation."
  kind: result
  source: {locator: "Linking physiology and omics, paragraph 2", page: 19, quote: "Proteomics revealed that a decreased need for P was driven by lower expression of P-containing proteins associated with translation"}
  status: verified
  note: "The Fig. 3 caption (page 14) says warming gives HIGHER expression of these proteins. It contradicts the body text; use the body text."
- id: C38
  text: "Physiological metrics corroborated this: cellular P quotas were lower under warming."
  kind: result
  source: {locator: "Linking physiology and omics, paragraph 2", page: 19, quote: "Physiological metrics corroborated this finding, with lower cellular P quotas under warming."}
  status: verified
- id: C39
  text: "P quotas acted as a currency converter between protein synthesis and the biogeochemical cycle of P."
  kind: interpretation
  source: {locator: "Linking physiology and omics, paragraph 2", page: 19, quote: "Hence, P quotas acted as a currency converter between protein synthesis and the biogeochemical cycle of P."}
  status: verified
- id: C40
  text: "The study showed the link between protein synthesis and P quotas serendipitously; the authors say we must actively seek such conceptual linkages in future, rather than uncovering them by chance."
  kind: interpretation
  source: {locator: "Linking physiology and omics, paragraph 2", page: 19, quote: "They showed serendipitously a link between protein synthesis and P quotas. In the future, we must actively seek conceptual linkages, rather than uncovering them by chance."}
  status: verified
- id: C41
  text: "The authors ask whether we are currently measuring the best physiological metrics to mesh omics with biogeochemistry."
  kind: interpretation
  source: {locator: "Linking physiology and omics, paragraph 3", page: 20, quote: "Physiology was established earlier than omics or biogeochemistry, which begs the question: are we currently measuring the best physiological metrics to mesh omics with biogeochemistry?"}
  status: verified
- id: C42
  text: "Although our current choice of physiological metrics needs urgent scrutiny, there is compelling evidence of the utility of long-established assays."
  kind: interpretation
  source: {locator: "Linking physiology and omics, paragraph 4", page: 21, quote: "Although our current choice of physiological metrics needs urgent scrutiny, there is compelling evidence of the utility of long-established assays"}
  status: verified
- id: C43
  text: "The way ahead may be to use molecular biology to reverse engineer the most pertinent physiological metrics."
  kind: interpretation
  source: {locator: "Linking physiology and omics, paragraph 4", page: 21, quote: "the way ahead may be to use molecular biology to “reverse engineer” the most pertinent physiological metrics"}
  status: verified
  note: "'May be'."
- id: C44
  text: "A useful point of departure would be to select processes in which protein abundance correlates with quantifiable metabolic activity."
  kind: interpretation
  source: {locator: "Linking physiology and omics, paragraph 4", page: 21, quote: "a useful point of departure would be to select processes in which protein abundance correlates with quantifiable metabolic activity."}
  status: verified
- id: C45
  text: "The authors think such co-design will facilitate the transition from lab- to field-based omics and lead in the coming decades to incorporation of omics into biogeochemical models."
  kind: interpretation
  source: {locator: "Linking physiology and omics, paragraph 4", page: 21, quote: "Such co-design, in our opinion, will further facilitate the transition from lab- to field-based omics and will lead in the coming decades to incorporation of omics into biogeochemical models."}
  status: verified
  note: "'In our opinion'; a prediction, not a result."
- id: C46
  text: "The transition to field studies will face additional challenges that centre on how marine biota integrate environmental history."
  kind: caveat
  source: {locator: "Linking physiology and omics, paragraph 5", page: 22, quote: "The transition to field studies will face additional challenges that centre on how marine biota integrate environmental history"}
  status: verified
- id: C47
  text: "An open question is whether the relationship between environmental forcing and cellular status is instantaneous or lagged."
  kind: caveat
  source: {locator: "Linking physiology and omics, paragraph 5", page: 22, quote: "An open question is whether the relationship between environmental forcing and cellular status is instantaneous or lagged"}
  status: verified
- id: C48
  text: "Different physiological metrics display a range of response times, as do different omics layers."
  kind: caveat
  source: {locator: "Linking physiology and omics, paragraph 5", page: 22, quote: "since different physiological metrics display a range of response times (; ), as do different omics layers ()"}
  status: verified
- id: C49
  text: "Physiological titration, for example manipulating Fe availability to contextualize cellular Fe status, is a promising approach to probe environmental history and cellular status."
  kind: interpretation
  source: {locator: "Linking physiology and omics, paragraph 5", page: 22, quote: "One promising approach to probe environmental history and cellular status is physiological titration, for example by manipulating Fe availability to contextualize cellular Fe status"}
  status: verified
- id: C50
  text: "Profiling robotic floats with multiple sensors are providing synoptic snapshots of spatial variability in ocean properties."
  kind: background
  source: {locator: "Linking physiology and omics, paragraph 5", page: 22, quote: "profiling robotic floats with multiple sensors are providing synoptic snapshots of spatial variability in ocean properties"}
  status: verified
- id: C51
  text: "A metaproteomic study of subsurface biota in the Tropical North Pacific found nitrite oxidoreductase associated with the bacterium Nitrospina abundant, and tried to estimate rates of nitrite oxidation by biochemistry, physiology and omics."
  kind: method
  source: {locator: "Conclusions, paragraph 1", page: 24, quote: "They reported that nitrite oxidoreductase associated with the bacterium Nitrospina was abundant in this stratum and explored whether they could estimate rates of nitrite oxidation using wide-ranging methods, including biochemistry (specific activity), physiology (Michaelis–Menten kinetics) and omics."}
  status: verified
- id: C52
  text: "Despite employing this innovative suite of approaches, the derived rates ranged >200-fold, pointing to the need to develop targeted physiological assays."
  kind: result
  source: {locator: "Conclusions, paragraph 1", page: 24, quote: "Despite employing this innovative suite of approaches, derived rates ranged >200-fold, pointing to the need to develop targeted physiological assays"}
  status: verified
  note: "A cited study. The authors' reading is that targeted assays are needed; do not say the study failed."
- id: C53
  text: "Holistic studies in Escherichia coli and Saccharomyces cerevisiae generated enzyme-directed functional rates, but this approach is restricted to organisms for which the function of every gene and protein is known."
  kind: background
  source: {locator: "Conclusions, paragraph 2", page: 25, quote: "holistic investigations of well-characterized model organisms have tracked every metabolite and protein to generate enzyme-directed functional rates in the bacterium Escherichia coli () and the yeast Saccharomyces cerevisiae (), but this approach is restricted to the organisms for which the function of every gene and protein is known"}
  status: verified
- id: C54
  text: "Sophisticated microbiome studies, which are more akin to oceanic microbial systems, reveal that a high number of metabolic functions remain uncharacterized."
  kind: background
  source: {locator: "Conclusions, paragraph 2", page: 25, quote: "sophisticated microbiome studies (from cheese to the human gut) (), which are more akin to oceanic microbial systems, reveal that there are still a high number of metabolic functions that remain uncharacterized"}
  status: verified
- id: C55
  text: "In biomedical and model-system omics, obtaining rates from omics is still under development."
  kind: interpretation
  source: {locator: "Conclusions, paragraph 2", page: 25, quote: "The latest developments in biomedical and model-system omics suggest that obtaining rates from omics is still under development."}
  status: verified
- id: C56
  text: "In the authors' opinion, it may be more straight-forward to co-design targeted physiological metrics that better link omics with marine biogeochemistry."
  kind: interpretation
  source: {locator: "Conclusions, paragraph 3", page: 26, quote: "In our opinion, it may be more straight-forward to co-design targeted physiological metrics that better link omics with marine biogeochemistry."}
  status: verified
- id: C57
  text: "The authors advocate better communication across these research communities, readily facilitated through co-design workshops and other forums."
  kind: interpretation
  source: {locator: "Conclusions, paragraph 3", page: 26, quote: "We advocate for better communication across these research communities that could be readily facilitated through co-design workshops and other forums"}
  status: verified
- id: C58
  text: "Expression-fitness landscapes have revealed that enzyme expression can have a ripple effect across layers of biological organization, adding complexity to deriving growth rates from enzymatic fluxes."
  kind: background
  source: {locator: "Conclusions, paragraph 2", page: 25, quote: "enzyme expression can have a “ripple” effect across layers of biological organization ranging from mechanistic, regulatory to systemic (), which adds further complexity to deriving growth rates from enzymatic fluxes"}
  status: verified
- id: C59
  text: "A figure in the paper shows the diel cycling and amplitudes of transcripts and proteins in Prochlorococcus."
  kind: background
  source: {locator: "Fig. 2 caption", page: 12, quote: "The diel cycling and amplitudes of transcripts and proteins in Prochlorococcus"}
  status: verified
- id: C60
  text: "Broader application of flow-through high-throughput rate measurements can improve the spatial and temporal coverage of N2 fixation."
  kind: interpretation
  source: {locator: "Lessons from marine diazotrophy, paragraph 5", page: 10, quote: "Broader application of flow-through high-throughput rate measurements can improve the spatial and temporal coverage of N2 fixation"}
  status: verified
- id: C61
  text: "One figure caption says warming results in higher expression of P-containing proteins associated with translation."
  kind: caveat
  source: {locator: "Fig. 3 caption", page: 14, quote: "Warming results in higher expression of P-containing proteins associated with translation"}
  status: unverified
  note: "Contradicts the body text (C37: lower expression). Kept out of the panels. Likely a caption slip, but the paper does not say so."
- id: C62
  text: "Marine and biomedical sciences both study the genome, transcriptome, proteome and metabolome, with most research on the first three."
  kind: background
  source: {locator: "The status of omics, paragraph 1", page: 13, quote: "Both marine and biomedical sciences study the genome, transcriptome, proteome and metabolome, with most research on the first three."}
  status: verified
- id: C63
  text: "Transcriptomics is a popular approach to explore how organisms respond to environmental change by characterizing shifts in mRNA abundance."
  kind: background
  source: {locator: "The status of omics, paragraph 1", page: 13, quote: "Transcriptomics is a popular approach to explore how organisms respond to environmental change by characterizing shifts in mRNA abundance"}
  status: verified
- id: C64
  text: "The authors use the history of N2 fixation (diazotrophy) research to reveal the benefits and limitations of physiological rate measurements, and how omics complements them."
  kind: method
  source: {locator: "Lessons from marine diazotrophy, paragraph 1", page: 6, quote: "Here, we use the history of N2 fixation (diazotrophy) research to reveal the benefits and limitations of physiological rate measurements, and how these measurements are complemented by more recent omics approaches"}
  status: verified
- id: C65
  text: "Earth system models include those within the Coupled Model Intercomparison Project (CMIP)."
  kind: background
  source: {locator: "Introduction, paragraph 1", page: 2, quote: "Earth system models, such as those within the Coupled Model Intercomparison Project (CMIP6)"}
  status: verified
  note: "The quote says CMIP6; the comic says CMIP (the project) except where C21 and C3 give the version."
