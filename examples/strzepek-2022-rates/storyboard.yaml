      text: The physiological metrics behind those rates, such as primary productivity, have not fundamentally changed in decades.
    - speaker: physio
      text: Still here.
    claim_ids:
    - C5
    humour:
      note: 'Deadpan: the physiologist says ''Still here.'' beside the caption that the rate metrics have not fundamentally changed in decades. (1) No number, hedge, scope or direction changes; the caption
        is the claim, the line is a pose. (2) A reader could take ''Still here'' as the authors'' own words, so it is a character''s line in speech, not in the caption. (3) The butt is the metric''s age,
        not the authors, and the physiologist is smiling. (4) It does not play down a caveat. (5) Unsure whether the authors, several of them physiologists, would read it as light teasing of their field,
        so a human decides.'
      keeps_claims_intact: false
    staging:
      characters:
      - id: physio
        x: 0.5
        pose: hold
        face: deadpan
        facing: right
        holding: mug
        scale: 0.9
