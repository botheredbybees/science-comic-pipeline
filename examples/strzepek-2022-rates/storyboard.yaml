version: 2
meta:
  title: 'The Currency Exchange: can omics give the models what they ask for?'
  audience: Early-career ocean scientists, and anyone who has heard that genes can now tell us what plankton are doing, and wondered whether that is enough for the climate models. Terms (omics, physiological
    rate, flux) are explained once, in a caption, the first time they appear.
  source:
    title: 'The ongoing need for rates: can physiology and omics come together to co-design the measurements needed to understand complex ocean biogeochemistry?'
    authors:
    - Robert F Strzepek
    - Brook L Nunn
    - Lennart T Bach
    - John A Berges
    - Erica B Young
    - Philip W Boyd
    year: 2022
    doi: 10.1093/plankt/fbac026
    url: https://doi.org/10.1093/plankt/fbac026
    licence: CC BY 4.0
    licence_checked: Europe PMC full-text XML (PMC9310281), 2026-11-13, via scripts/fetch_source.py
  spine:
    and: Earth system models run on rates and fluxes, but the physiological metrics that supply those rates have not fundamentally changed in decades, while omics has evolved rapidly and some assume it
      can simply infer the rates (C1, C2, C5, C6, C7).
    but: 'Omics mostly shows what an organism could do, not how fast it does it: nif gene expression is not well correlated with 15N-based N2 fixation rates, mRNA and protein do not line up, and rates derived
      from omics for a nitrite-oxidising bacterium ranged more than 200-fold (C19, C27, C52), so the authors conclude omics is unlikely to give rates within a decade (C10).'
    therefore: The authors propose that physiological rates can bridge omics and biogeochemistry, as phosphorus quotas did when they linked a diatom's protein synthesis to the P cycle by serendipity, and
      they advocate co-designing a new generation of rate measurements on purpose, while admitting open questions about environmental history in the field (C33, C39, C40, C12, C46, C47).
  left_out:
  - 'The iron cycle case study and the Phaeocystis and Crocosphaera iron examples: one paragraph of the paper, with no result figures to cite.'
  - 'Fig. 4 (reverse-engineering phosphorus metrics) and Fig. 5 (the Fe time series and titration experiment): the values and pathway detail are in figures; only the captions are in the ledger.'
  - 'Almost all the work the authors cite: the text file the pipeline uses has the in-text citations removed, so the comic cannot name who did the Prochlorococcus, diatom, Nitrospina or E. coli studies.'
  - Details of proteomics methods, the CMIP model comparisons, the expression-fitness work and the deep-neural-network modelling.
  - 'The story is a perspective argument, not an experiment: there is no new data in the comic, and the authors'' opinions are marked as opinions.'
  - The exchange-booth setting is the comic's own conceit, built on the paper's phrase 'currency converter'; the paper does not describe a booth.
cast:
- id: modeller
  name: The modeller
  role: guide; an Earth system modeller who asks what the reader would ask. An archetype, not a real person.
  look: dark hair in a bun, glasses, runs the exchange desk
  appearance:
    hair: bun
    glasses: true
    body: stick
- id: physio
  name: The physiologist
  role: measures rates in bottles and flasks; an archetype
  look: blond hair, lab coat, holds a flask
  appearance:
    hair: bob
    hair_tone: strands
    coat: true
    body: stick
- id: omicist
  name: The omics researcher
  role: reads genes, mRNA and proteins; an archetype
  look: dark ponytail, glasses, lab coat, carries a large paper stack
  appearance:
    hair: ponytail
    glasses: true
    coat: true
    body: stick
- id: dot
  name: Dot, a diatom
  role: stands in for the lab diatom in the phosphorus study; says only what the study found
  look: a diatom
  appearance:
    body: diatom
claims:
- id: C1
  text: The main modeling currencies are biological rates and biogeochemical fluxes.
  kind: background
  source:
    locator: Abstract
    page: 1
    quote: the main modeling currencies are biological rates and biogeochemical fluxes
  status: verified
- id: C2
  text: The currencies of the Earth system models in CMIP include physiological rates and the biogeochemical fluxes of bioactive elements.
  kind: background
  source:
    locator: Introduction, paragraph 1
    page: 2
    quote: The CMIP currencies include the critically important rates at which metabolism occurs in living organisms (i.e. physiological rates) and the biogeochemical fluxes of bioactive elements.
  status: verified
- id: C3
  text: The authors think it is unlikely that these currencies will change in the coming decade, for example when CMIP7 is developed.
  kind: interpretation
  source:
    locator: Introduction, paragraph 1
    page: 2
    quote: It is unlikely that these currencies will change in the coming decade, for example when CMIP7 is developed.
  status: verified
- id: C4
  text: Model projections are hindered in part by our inability to untangle how marine life responds to complex ocean change.
  kind: background
  source:
    locator: Introduction, paragraph 1
    page: 2
    quote: our inability to untangle how marine life responds to complex ocean change
  status: verified
  note: One of two issues the authors name; the other is computational limits on parameterisations.
- id: C5
  text: The physiological metrics that are the cornerstones of Earth system models, such as primary productivity, have not fundamentally changed in decades.
  kind: background
  source:
    locator: Introduction, paragraph 2
    page: 3
    quote: The physiological metrics used to quantify biological rates that are the cornerstones of Earth system models, such as primary productivity, have not fundamentally changed in decades.
  status: verified
- id: C6
  text: Omics techniques have evolved rapidly this century and have the potential to supersede physiological metrics.
  kind: background
  source:
    locator: Introduction, paragraph 2
    page: 3
    quote: omics techniques have evolved rapidly this century and have the potential to supersede physiological metrics
  status: verified
- id: C7
  text: Some people implicitly assume that measuring physiological rates directly is obsolete, because rates can be inferred from omics.
  kind: background
  source:
    locator: Introduction, paragraph 2
    page: 3
    quote: an implicit assumption by some that measuring physiological rates directly is obsolete, as they can be inferred from omics
  status: verified
  note: '''By some'', the authors'' words; do not make it everyone''s view.'
- id: C8
  text: Omics provides a surfeit of data, at a level of detail that is often difficult to relate to the information from physiological rate measurements.
  kind: interpretation
  source:
    locator: Introduction, paragraph 2
    page: 3
    quote: omics provides a surfeit of data, at a level of detail that is often difficult to relate to the information provided by physiological rate measurements
  status: verified
- id: C9
  text: The authors call the growing mismatch between the currencies of global-scale models (rates and fluxes) and the aspirations of omics something that must be addressed urgently.
  kind: interpretation
  source:
    locator: Introduction, paragraph 2
    page: 3
    quote: This growing mismatch between the currencies of global-scale models (rates and fluxes) and the aspirations of omics (coupling cellular potential via omics to Earth system model projections) must
      be addressed urgently.
  status: verified
- id: C10
  text: The authors conclude that it is unlikely that omics can provide physiological rates in the coming decade.
  kind: interpretation
  source:
    locator: Abstract
    page: 1
    quote: we conclude that it is unlikely that omics can provide such rates in the coming decade.
  status: verified
  note: A conclusion from biomedical trajectory plus case studies, not a measurement. 'Unlikely', not 'impossible'.
- id: C11
  text: The authors say physiological research has stagnated, in part driven by the advent and rapid evolution of molecular biological techniques.
  kind: interpretation
  source:
    locator: Abstract
    page: 1
    quote: physiological research has stagnated, in part driven by the advent and rapid evolution of molecular biological techniques
  status: verified
  note: The authors' view; 'in part'.
- id: C12
  text: The authors advocate the co-design of a new generation of rate measurements that better link the benefits of omics and physiology.
  kind: interpretation
  source:
    locator: Abstract
    page: 1
    quote: We advocate for the co-design of a new generation of rate measurements that better link the benefits of omics and physiology.
  status: verified
- id: C13
  text: 'The authors use three approaches: ocean N2 fixation as an example, the recent trajectory of biomedical research, and the ocean phosphorus and iron cycles.'
  kind: method
  source:
    locator: Introduction, paragraph 3
    page: 4
    quote: We employ three approaches to address this question. First, we use ocean N2 fixation as an illustrative example of research that has evolved through joint advances in physiology and omics (Fig.
      1). Second, we examine the recent trajectory of biomedical research to forecast how ocean sciences might evolve in the next decade. Third, we broaden our view by examining insights that can be gained
      for understanding the ocean phosphorus (P) and iron (Fe) cycles
  status: verified
- id: C14
  text: Physiological studies played an important early role by quantifying rates of diazotrophy (nitrogen fixation).
  kind: background
  source:
    locator: Lessons from marine diazotrophy, paragraph 2
    page: 7
    quote: Physiological studies played an important early role by quantifying rates of diazotrophy
  status: verified
- id: C15
  text: Those rate measurements provided the integrated rates needed to estimate global biogeochemical fluxes of N.
  kind: background
  source:
    locator: Lessons from marine diazotrophy, paragraph 2
    page: 7
    quote: These measurements provided the integrated rates necessary to estimate global biogeochemical fluxes of N
  status: verified
- id: C16
  text: Imbalances in the N fluxes uncovered unidentified N sources, and genetic tools then identified additional diazotrophic taxa that contribute to ocean N2 fixation.
  kind: background
  source:
    locator: Lessons from marine diazotrophy, paragraph 2
    page: 7
    quote: imbalances in these N fluxes have uncovered unidentified N sources, and the subsequent application of genetic tools has identified additional diazotrophic taxa that contribute to ocean N2 fixation
  status: verified
- id: C17
  text: Omics has revealed diverse N2 fixers, including the unicellular cyanobacteria Crocosphaera and UCYN-A.
  kind: background
  source:
    locator: Lessons from marine diazotrophy, paragraph 3
    page: 8
    quote: Omics has revealed diverse N2 fixers including the unicellular cyanobacteria Crocosphaera and UCYN-A
  status: verified
- id: C18
  text: Nitrogenase (nif) gene abundance does not directly equate to N2 fixation rates.
  kind: result
  source:
    locator: Lessons from marine diazotrophy, paragraph 3
    page: 8
    quote: But, nif gene abundance does not directly equate to either diazotroph abundance- and biomass-based biogeographic “currencies” () or to N2 fixation rates
  status: verified
- id: C19
  text: Measurements of nif expression are not well correlated with 15N-based rates of N2 fixation.
  kind: result
  source:
    locator: Lessons from marine diazotrophy, paragraph 3
    page: 8
    quote: measurements of nif expression are not well correlated with 15N-based rates of N2 fixation
  status: verified
- id: C21
  text: N2 fixation is not included in the CMIP6 models, which currently project declining productivity in low latitude oceans in coming decades.
  kind: background
  source:
    locator: Lessons from marine diazotrophy, paragraph 4
    page: 9
    quote: Yet, N2 fixation is not included in the CMIP6 models, which currently project declining productivity in low latitude oceans in coming decades
  status: verified
- id: C22
  text: Both rates and omics will be needed increasingly to reveal and quantify currently unknown but biogeochemically important pathways for the turnover of N.
  kind: interpretation
  source:
    locator: Lessons from marine diazotrophy, paragraph 4
    page: 9
    quote: both rates and omics will be needed increasingly to reveal and quantify currently unknown (but biogeochemically important) pathways for the turnover of N
  status: verified
- id: C25
  text: A critique the authors cite says mRNA abundance is a poor proxy for protein abundance, and that fitness is primarily determined by proteins.
  kind: background
  source:
    locator: The status of omics, paragraph 1
    page: 13
    quote: (iii) fitness is primarily determined by proteins, and mRNA abundance is a poor proxy for protein abundance
  status: verified
  note: A critique by other authors that Strzepek et al. cite, not their own result.
- id: C27
  text: It is well recognized in marine science that the amplitude and timing of the mRNA pool does not align with protein expression.
  kind: background
  source:
    locator: The status of omics, paragraph 2
    page: 15
    quote: it is well recognized that the amplitude and timing of the mRNA pool does not align with protein expression.
  status: verified
- id: C28
  text: Diel changes in the transcriptome and proteome within a single cyanobacteria species illustrated this misalignment.
  kind: background
  source:
    locator: The status of omics, paragraph 2
    page: 15
    quote: This misalignment was illustrated in while tracking diel changes in the transcriptome and proteome within a single cyanobacteria species (Fig. 2).
  status: verified
  note: The species is Prochlorococcus per the Fig. 2 caption (page 12), a cited earlier study.
- id: C30
  text: Even in advanced biomedical research, post-transcriptional and post-translational modifications to enzymes are confounding issues in deriving metabolic rates from omics.
  kind: interpretation
  source:
    locator: The status of omics, paragraph 2
    page: 15
    quote: Hence, even in advanced biomedical research, there are confounding issues, driven by post-transcriptional and post-translational modifications to enzymes, in deriving metabolic rates from omics.
  status: verified
- id: C31
  text: Omics-based approaches provide static snap-shots of physiological potential.
  kind: interpretation
  source:
    locator: The status of omics, paragraph 3
    page: 16
    quote: omics-based approaches provide static “snap-shots” of physiological potential
  status: verified
- id: C32
  text: It is physiological activity, modified by species differences, environmental drivers and the interactions between the two, that ultimately drives biogeochemical cycles.
  kind: interpretation
  source:
    locator: The status of omics, paragraph 3
    page: 16
    quote: it is physiological activity—as modified by biological species differences, environmental drivers and the interactions between the two—that ultimately drives biogeochemical cycles.
  status: verified
- id: C33
  text: The authors propose that physiological rates can bridge biogeochemistry and omics.
  kind: interpretation
  source:
    locator: Linking physiology and omics, paragraph 1
    page: 18
    quote: We propose that physiological rates can bridge biogeochemistry and omics.
  status: verified
- id: C34
  text: Physiological rates quantify the integrated activity of proteins that drive marine biogeochemical cycles, in units that modelers can use.
  kind: interpretation
  source:
    locator: Linking physiology and omics, paragraph 1
    page: 18
    quote: Physiological rates quantify the integrated activity of proteins that drive marine biogeochemical cycles in units that modelers can use
  status: verified
- id: C35
  text: A lab study used proteomics and physiological metrics to explore the cumulative effect of five climate-change stressors on a subpolar diatom.
  kind: method
  source:
    locator: Linking physiology and omics, paragraph 2
    page: 19
    quote: a lab study used proteomics and physiological metrics to explore the cumulative effect of five climate-change stressors on a subpolar diatom
  status: verified
  note: Body text says 'subpolar'; Fig. 3 caption (page 14) says 'subantarctic'. Say 'a diatom' in panels.
- id: C36
  text: In that study the effect of decreased nutrient supply in a future ocean was offset by warming.
  kind: result
  source:
    locator: Linking physiology and omics, paragraph 2
    page: 19
    quote: A central finding was that the effect of decreased nutrient supply in a future ocean was offset by warming.
  status: verified
- id: C37
  text: Proteomics revealed that a decreased need for P was driven by lower expression of P-containing proteins associated with translation.
  kind: result
  source:
    locator: Linking physiology and omics, paragraph 2
    page: 19
    quote: Proteomics revealed that a decreased need for P was driven by lower expression of P-containing proteins associated with translation
  status: verified
  note: The Fig. 3 caption (page 14) says warming gives HIGHER expression of these proteins. It contradicts the body text; use the body text.
- id: C38
  text: 'Physiological metrics corroborated this: cellular P quotas were lower under warming.'
  kind: result
  source:
    locator: Linking physiology and omics, paragraph 2
    page: 19
    quote: Physiological metrics corroborated this finding, with lower cellular P quotas under warming.
  status: verified
- id: C39
  text: P quotas acted as a currency converter between protein synthesis and the biogeochemical cycle of P.
  kind: interpretation
  source:
    locator: Linking physiology and omics, paragraph 2
    page: 19
    quote: Hence, P quotas acted as a currency converter between protein synthesis and the biogeochemical cycle of P.
  status: verified
- id: C40
  text: The study showed the link between protein synthesis and P quotas serendipitously; the authors say we must actively seek such conceptual linkages in future, rather than uncovering them by chance.
  kind: interpretation
  source:
    locator: Linking physiology and omics, paragraph 2
    page: 19
    quote: They showed serendipitously a link between protein synthesis and P quotas. In the future, we must actively seek conceptual linkages, rather than uncovering them by chance.
  status: verified
- id: C41
  text: The authors ask whether we are currently measuring the best physiological metrics to mesh omics with biogeochemistry.
  kind: interpretation
  source:
    locator: Linking physiology and omics, paragraph 3
    page: 20
    quote: 'Physiology was established earlier than omics or biogeochemistry, which begs the question: are we currently measuring the best physiological metrics to mesh omics with biogeochemistry?'
  status: verified
- id: C42
  text: Although our current choice of physiological metrics needs urgent scrutiny, there is compelling evidence of the utility of long-established assays.
  kind: interpretation
  source:
    locator: Linking physiology and omics, paragraph 4
    page: 21
    quote: Although our current choice of physiological metrics needs urgent scrutiny, there is compelling evidence of the utility of long-established assays
  status: verified
- id: C43
  text: The way ahead may be to use molecular biology to reverse engineer the most pertinent physiological metrics.
  kind: interpretation
  source:
    locator: Linking physiology and omics, paragraph 4
    page: 21
    quote: the way ahead may be to use molecular biology to “reverse engineer” the most pertinent physiological metrics
  status: verified
  note: '''May be''.'
- id: C44
  text: A useful point of departure would be to select processes in which protein abundance correlates with quantifiable metabolic activity.
  kind: interpretation
  source:
    locator: Linking physiology and omics, paragraph 4
    page: 21
    quote: a useful point of departure would be to select processes in which protein abundance correlates with quantifiable metabolic activity.
  status: verified
- id: C45
  text: The authors think such co-design will facilitate the transition from lab- to field-based omics and lead in the coming decades to incorporation of omics into biogeochemical models.
  kind: interpretation
  source:
    locator: Linking physiology and omics, paragraph 4
    page: 21
    quote: Such co-design, in our opinion, will further facilitate the transition from lab- to field-based omics and will lead in the coming decades to incorporation of omics into biogeochemical models.
  status: verified
  note: '''In our opinion''; a prediction, not a result.'
- id: C46
  text: The transition to field studies will face additional challenges that centre on how marine biota integrate environmental history.
  kind: caveat
  source:
    locator: Linking physiology and omics, paragraph 5
    page: 22
    quote: The transition to field studies will face additional challenges that centre on how marine biota integrate environmental history
  status: verified
- id: C47
  text: An open question is whether the relationship between environmental forcing and cellular status is instantaneous or lagged.
  kind: caveat
  source:
    locator: Linking physiology and omics, paragraph 5
    page: 22
    quote: An open question is whether the relationship between environmental forcing and cellular status is instantaneous or lagged
  status: verified
- id: C48
  text: Different physiological metrics display a range of response times, as do different omics layers.
  kind: caveat
  source:
    locator: Linking physiology and omics, paragraph 5
    page: 22
    quote: since different physiological metrics display a range of response times (; ), as do different omics layers ()
  status: verified
- id: C51
  text: A metaproteomic study of subsurface biota in the Tropical North Pacific found nitrite oxidoreductase associated with the bacterium Nitrospina abundant, and tried to estimate rates of nitrite oxidation
    by biochemistry, physiology and omics.
  kind: method
  source:
    locator: Conclusions, paragraph 1
    page: 24
    quote: They reported that nitrite oxidoreductase associated with the bacterium Nitrospina was abundant in this stratum and explored whether they could estimate rates of nitrite oxidation using wide-ranging
      methods, including biochemistry (specific activity), physiology (Michaelis–Menten kinetics) and omics.
  status: verified
- id: C52
  text: Despite employing this innovative suite of approaches, the derived rates ranged >200-fold, pointing to the need to develop targeted physiological assays.
  kind: result
  source:
    locator: Conclusions, paragraph 1
    page: 24
    quote: Despite employing this innovative suite of approaches, derived rates ranged >200-fold, pointing to the need to develop targeted physiological assays
  status: verified
  note: A cited study. The authors' reading is that targeted assays are needed; do not say the study failed.
- id: C55
  text: In biomedical and model-system omics, obtaining rates from omics is still under development.
  kind: interpretation
  source:
    locator: Conclusions, paragraph 2
    page: 25
    quote: The latest developments in biomedical and model-system omics suggest that obtaining rates from omics is still under development.
  status: verified
- id: C56
  text: In the authors' opinion, it may be more straight-forward to co-design targeted physiological metrics that better link omics with marine biogeochemistry.
  kind: interpretation
  source:
    locator: Conclusions, paragraph 3
    page: 26
    quote: In our opinion, it may be more straight-forward to co-design targeted physiological metrics that better link omics with marine biogeochemistry.
  status: verified
- id: C57
  text: The authors advocate better communication across these research communities, readily facilitated through co-design workshops and other forums.
  kind: interpretation
  source:
    locator: Conclusions, paragraph 3
    page: 26
    quote: We advocate for better communication across these research communities that could be readily facilitated through co-design workshops and other forums
  status: verified
- id: C62
  text: Marine and biomedical sciences both study the genome, transcriptome, proteome and metabolome, with most research on the first three.
  kind: background
  source:
    locator: The status of omics, paragraph 1
    page: 13
    quote: Both marine and biomedical sciences study the genome, transcriptome, proteome and metabolome, with most research on the first three.
  status: verified
- id: C64
  text: The authors use the history of N2 fixation (diazotrophy) research to reveal the benefits and limitations of physiological rate measurements, and how omics complements them.
  kind: method
  source:
    locator: Lessons from marine diazotrophy, paragraph 1
    page: 6
    quote: Here, we use the history of N2 fixation (diazotrophy) research to reveal the benefits and limitations of physiological rate measurements, and how these measurements are complemented by more recent
      omics approaches
  status: verified
- id: C65
  text: Earth system models include those within the Coupled Model Intercomparison Project (CMIP).
  kind: background
  source:
    locator: Introduction, paragraph 1
    page: 2
    quote: Earth system models, such as those within the Coupled Model Intercomparison Project (CMIP6)
  status: verified
  note: The quote says CMIP6; the comic says CMIP (the project) except where C21 and C3 give the version.
