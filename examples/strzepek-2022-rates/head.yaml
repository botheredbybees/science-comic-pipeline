version: 2
meta:
  title: "The Currency Exchange: can omics give the models what they ask for?"
  audience: "Early-career ocean scientists, and anyone who has heard that genes can now tell us what plankton are doing, and wondered whether that is enough for the climate models. Terms (omics, physiological rate, flux) are explained once, in a caption, the first time they appear."
  source:
    title: "The ongoing need for rates: can physiology and omics come together to co-design the measurements needed to understand complex ocean biogeochemistry?"
    authors: ["Robert F Strzepek", "Brook L Nunn", "Lennart T Bach", "John A Berges", "Erica B Young", "Philip W Boyd"]
    year: 2022
    doi: "10.1093/plankt/fbac026"
    url: "https://doi.org/10.1093/plankt/fbac026"
    licence: "CC BY 4.0"
    licence_checked: "Europe PMC full-text XML (PMC9310281), 2026-11-13, via scripts/fetch_source.py"
  spine:
    and: "Earth system models run on rates and fluxes, but the physiological metrics that supply those rates have not fundamentally changed in decades, while omics has evolved rapidly and some assume it can simply infer the rates (C1, C2, C5, C6, C7)."
    but: "Omics mostly shows what an organism could do, not how fast it does it: nif gene expression is not well correlated with 15N-based N2 fixation rates, mRNA and protein do not line up, and rates derived from omics for a nitrite-oxidising bacterium ranged more than 200-fold (C19, C27, C52), so the authors conclude omics is unlikely to give rates within a decade (C10)."
    therefore: "The authors propose that physiological rates can bridge omics and biogeochemistry, as phosphorus quotas did when they linked a diatom's protein synthesis to the P cycle by serendipity, and they advocate co-designing a new generation of rate measurements on purpose, while admitting open questions about environmental history in the field (C33, C39, C40, C12, C46, C47)."
  left_out:
    - "The iron cycle case study and the Phaeocystis and Crocosphaera iron examples: one paragraph of the paper, with no result figures to cite."
    - "Fig. 4 (reverse-engineering phosphorus metrics) and Fig. 5 (the Fe time series and titration experiment): the values and pathway detail are in figures; only the captions are in the ledger."
    - "Almost all the work the authors cite: the text file the pipeline uses has the in-text citations removed, so the comic cannot name who did the Prochlorococcus, diatom, Nitrospina or E. coli studies."
    - "Details of proteomics methods, the CMIP model comparisons, the expression-fitness work and the deep-neural-network modelling."
    - "The story is a perspective argument, not an experiment: there is no new data in the comic, and the authors' opinions are marked as opinions."
    - "The exchange-booth setting is the comic's own conceit, built on the paper's phrase 'currency converter'; the paper does not describe a booth."
