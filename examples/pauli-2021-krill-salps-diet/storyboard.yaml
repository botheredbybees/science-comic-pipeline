    shift in plankton size along the WAP might not favor salps as previously suggested.
  kind: interpretation
  source:
    locator: Discussion, paragraph 10
    page: 40
    quote: we observed selective feeding behavior of both krill and salps and did not find evidence for more efficient feeding on small prey by salps compared to krill. This indicates that the projected
      shift in plankton size along the WAP might not favor salps as previously suggested
  status: verified
- id: C76
  text: Future studies should further investigate the selective feeding behavior using both field and laboratory tests.
