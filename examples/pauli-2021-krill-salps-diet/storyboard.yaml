- id: B6
  title: So what?
  act: discussion
  panels:
  - id: B6.1
    weight: wide
    frame: borderless
    height: short
    transition: scene-to-scene
    word_picture: picture-specific
    scene: Sal stands alone with a deadpan face.
    speech:
    - speaker: narrator
      kind: caption
      text: It remains unclear how salps perform such selective feeding behavior.
    - speaker: sal
      text: Don't look at me.
    claim_ids:
    - C63
    humour:
      note: 'Sal shrugs and deflects, as if asked to explain itself. The caption is the authors'' own statement of what is unknown, unchanged. 1: nothing changes. 2: the line is plainly Sal''s, but it could
        be read as the salp being unwilling to say, so a human should confirm it does not imply anything about salp behaviour. 3: the butt is the salp and the authors'' own uncertainty is left intact. 4:
        it plays the caveat straight (the unknown stays unknown), not down. 5: reads as honest, but unsure whether a shrugging salp suggests there is a mechanism to hide.'
      keeps_claims_intact: false
    staging:
      characters:
